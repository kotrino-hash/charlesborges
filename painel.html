            <datalist id="c-cli-lista">${S.clientes.map((x) => `<option value="${esc(x.nome)}"></option>`).join("")}</datalist></div>
          <div class="campo"><label for="c-proc">Processo</label><select id="c-proc" ${procsCli.length ? "" : "disabled"}><option value="">${procsCli.length ? "Nenhum" : "Escolha o cliente"}</option>
            ${procsCli.map((x) => `<option value="${x.id}" ${C.processo_id === x.id ? "selected" : ""}>${esc(x.titulo)}${x.numero ? " · " + esc(x.numero) : ""}</option>`).join("")}</select></div>
        </div>
        ${form}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button type="submit" class="btn btn-primario">Calcular</button><button type="button" class="btn btn-sec" id="c-limpar">Limpar</button></div>
      </form>
      <div id="c-res">${C.res ? resultadoHTML(C) : `<div class="vazio">Preencha os dados e clique em Calcular.<br><span class="peq">${C.aba === "atualizacao" ? "Correção e juros conforme o índice escolhido, com memória de cálculo." : "Regras do Manual de Cálculos da Justiça Federal (Resolução CJF 990/2026)."}</span></div>`}</div>
    </div>
    <div class="bloco" style="margin-top:28px"><div class="barra"><h2>Cálculos salvos</h2></div><div id="c-salvos"><div class="carregando" style="padding:20px">Carregando...</div></div></div>
  </div>`;

  const f = app.querySelector("#c-form");
  const lerForm = () => {
    const q = {};
    if (C.aba === "atualizacao") {
      q.itens = p.itens.map((_, i) => ({ descricao: val(f, "desc" + i), data: val(f, "data" + i), valor: numBR(val(f, "valor" + i)) }));
      q.pagamentos = (p.pagamentos || []).map((_, i) => ({ descricao: val(f, "pdesc" + i), data: val(f, "pdata" + i), valor: numBR(val(f, "pvalor" + i)) }));
      Object.assign(q, { dataFinal: val(f, "dataFinal"), regime: val(f, "regime"), juros: val(f, "juros"), jurosDesde: val(f, "jurosDesde"),
        multa: val(f, "multa").replace(",", "."), honorarios: val(f, "honorarios").replace(",", ".") });
    } else {
      Object.assign(q, { modo: C.aba, especie: val(f, "especie"), dib: val(f, "dib"), dcb: val(f, "dcb"), rmiModo: f.querySelector("[name=rmiModo]:checked").value,
        rmi: numBR(val(f, "rmi")), ajuizamento: val(f, "ajuizamento"), citacao: val(f, "citacao"), dip: val(f, "dip"), dataCalculo: val(f, "dataCalculo") || HOJE() });
      for (const k of ["decimoTerceiro", "pisoSM", "prescricao", "vincendas", "vincendas13"]) q[k] = f.elements[k] ? f.elements[k].checked : false;
      q.descontos = (p.descontos || []).map((_, i) => ({ descricao: val(f, "dd" + i), inicio: val(f, "di" + i), fim: val(f, "df" + i), modo: val(f, "dm" + i),
        valor: numBR(val(f, "dv" + i)), decimo: f.elements["d13" + i].checked }));
    }
    q.aba = C.aba;
    return q;
  };
  const guardar = () => { C.params = lerForm(); };

  // cliente e processo
  const inCli = app.querySelector("#c-cli");
  inCli.onchange = () => {
    guardar();
    const c = S.clientes.find((x) => norm(x.nome) === norm(inCli.value));
    C.cliente_id = c ? c.id : null; C.processo_id = null;
    telaCalculos();
  };
  app.querySelector("#c-proc").onchange = (e) => { C.processo_id = e.target.value || null; };
  app.querySelectorAll("[data-calc-aba]").forEach((b) => (b.onclick = () => {
    if (b.dataset.calcAba === C.aba) return;
    guardar();
    const destinoPrev = b.dataset.calcAba !== "atualizacao", origemPrev = C.aba !== "atualizacao";
    C.params = destinoPrev && origemPrev ? { ...C.params, modo: b.dataset.calcAba, aba: b.dataset.calcAba } : paramsPadrao(b.dataset.calcAba);
    C.aba = b.dataset.calcAba; C.res = null; C.salvoId = null;
    telaCalculos();
  }));
  app.querySelector("#c-limpar").onclick = () => { C.params = paramsPadrao(C.aba); C.res = null; C.salvoId = null; telaCalculos(); };
  app.querySelector("#c-atualizar-idx").onclick = async (e) => {
    e.target.disabled = true;
    const r1 = await db.rpc("indices_atualizar_agora");
    if (r1.error) { e.target.disabled = false; return toast(r1.error.message, true); }
    toast("Consultando o Banco Central... aguarde alguns segundos.");
    await new Promise((ok) => setTimeout(ok, 12000));
    const r2 = await db.rpc("indices_processar_agora");
    if (r2.error) { e.target.disabled = false; return toast(r2.error.message, true); }
    guardar(); await carregarIndices(true); toast("Índices atualizados."); telaCalculos();
  };
  if (C.aba !== "atualizacao") {
    f.querySelectorAll("[name=rmiModo]").forEach((r) => (r.onchange = () => (app.querySelector("#c-rmi-campo").hidden = r.value !== "valor" || !r.checked)));
    f.elements.especie.onchange = () => {
      const e = ESPECIES[f.elements.especie.value];
      f.elements.decimoTerceiro.checked = e.d13; f.elements.pisoSM.checked = e.piso;
      f.querySelector(`[name=rmiModo][value=${e.sm ? "sm" : "valor"}]`).checked = true;
      app.querySelector("#c-rmi-campo").hidden = !!e.sm;
      if (e.dias && f.elements.dib.value && !f.elements.dcb.value) f.elements.dcb.value = somaDias(f.elements.dib.value, e.dias - 1);
    };
    app.querySelector("#c-add-desc").onclick = () => { guardar(); C.params.descontos = [...(C.params.descontos || []), { descricao: "", inicio: f.elements.dib.value || "", fim: "", modo: "sm", valor: "", decimo: true }]; telaCalculos(); };
    app.querySelectorAll("[data-rem-desc]").forEach((b) => (b.onclick = () => { guardar(); C.params.descontos.splice(Number(b.dataset.remDesc), 1); telaCalculos(); }));
    f.querySelectorAll("[name^=dm]").forEach((sel) => (sel.onchange = () => { f.elements["dv" + sel.name.slice(2)].hidden = sel.value !== "valor"; }));
    f.elements.dib.onchange = () => {
      const e = ESPECIES[f.elements.especie.value];
      if (e.dias && f.elements.dib.value) f.elements.dcb.value = somaDias(f.elements.dib.value, e.dias - 1);
    };
  } else {
    app.querySelector("#c-add").onclick = () => { guardar(); C.params.itens.push({ descricao: "", data: "", valor: "" }); telaCalculos(); };
    app.querySelector("#c-add-pag").onclick = () => { guardar(); C.params.pagamentos = [...(C.params.pagamentos || []), { descricao: "", data: "", valor: "" }]; telaCalculos(); };
    app.querySelectorAll("[data-rem-pag]").forEach((b) => (b.onclick = () => { guardar(); C.params.pagamentos.splice(Number(b.dataset.remPag), 1); telaCalculos(); }));
    app.querySelectorAll("[data-rem]").forEach((b) => (b.onclick = () => {
      guardar(); C.params.itens.splice(Number(b.dataset.rem), 1);
      if (!C.params.itens.length) C.params.itens.push({ descricao: "", data: "", valor: "" });
      telaCalculos();
    }));
  }
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = lerForm();
    let erro = "";
    if (C.aba === "atualizacao") {
      if (!q.itens.some((it) => it.data && it.valor)) erro = "Informe ao menos um valor com a respectiva data.";
      else if (!q.dataFinal) erro = "Informe a data até quando atualizar.";
      else if (q.itens.some((it) => it.data && it.data > q.dataFinal)) erro = "Há valor com data posterior à data da atualização.";
      else if (q.pagamentos.some((it) => it.valor && !it.data)) erro = "Informe a data de cada valor recebido.";
      else if (q.pagamentos.some((it) => it.data && it.data > q.dataFinal)) erro = "Há valor recebido com data posterior à data da atualização.";
    } else {
      if (!q.dib) erro = "Informe a DIB.";
      else if (!q.ajuizamento) erro = "Informe a data do ajuizamento.";
      else if (q.rmiModo === "valor" && !q.rmi) erro = "Informe a RMI.";
      else if (q.dcb && q.dcb < q.dib) erro = "A cessação não pode ser anterior à DIB.";
      else if (C.aba === "causa" && q.dib >= q.ajuizamento) erro = "A DIB é posterior ao ajuizamento: não há parcelas vencidas.";
      else if (C.aba === "atrasados" && q.dip && q.dip < q.dib) erro = "A DIP não pode ser anterior à DIB.";
      else if (q.descontos.some((d) => !d.inicio || !d.fim)) erro = "Informe o período (de/até) de cada valor recebido.";
      else if (q.descontos.some((d) => d.fim < d.inicio)) erro = "Em um dos valores recebidos, a data final é anterior à inicial.";
      else if (q.descontos.some((d) => d.modo === "valor" && !d.valor)) erro = "Informe o valor mensal recebido.";
    }
    if (erro) return toast(erro, true);
    C.params = q; C.salvoId = null;
    C.res = C.aba === "atualizacao" ? calcularAtualizacao(q, I) : calcularPrevidenciario(q, I);
    telaCalculos();
    setTimeout(() => app.querySelector("#c-res")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
  });
  if (C.res) ligarResultado(C);
  listarCalculosSalvos();
}

function textoPeticao(C) {
  const r = C.res, p = C.params;
  if (r.tipo === "atualizacao") {
    const t = r.totais;
    const partes = [];
    if (t.multa) partes.push(`multa de ${String(p.multa).replace(".", ",")}%, no importe de ${moeda(t.multa)}`);
    if (t.honorarios) partes.push(`honorários de ${String(p.honorarios).replace(".", ",")}%, no importe de ${moeda(t.honorarios)}`);
    if (t.pago) return `O débito, atualizado até ${dBR(r.dataCalculo)}, soma ${moeda(t.debito)}, já incluídos ${moeda(t.juros)} de juros de mora. Abatidos os valores recebidos (${moeda(t.pagoValor)}, que atualizados pelos mesmos critérios correspondem a ${moeda(t.pago)}), o saldo devedor perfaz ${moeda(t.subtotal)}${partes.length ? `, ao qual se acrescem ${partes.join(", e ")}, totalizando ${moeda(t.total)} (${reaisExtenso(t.total)})` : ` (${reaisExtenso(Math.max(t.subtotal, 0))})`}, conforme memória de cálculo anexa.`;
    return `O débito, atualizado até ${dBR(r.dataCalculo)}, perfaz ${moeda(t.total)} (${reaisExtenso(t.total)}), dos quais ${moeda(t.corrigido)} correspondem ao principal corrigido${t.juros ? ` e ${moeda(t.juros)} aos juros de mora` : ""}${partes.length ? `, acrescidos de ${partes.join(", e de ")}` : ""}, conforme memória de cálculo anexa.`;
  }
  if (r.modo === "atrasados") {
    return `O montante das parcelas vencidas de ${dBR(r.periodo.inicio)} a ${dBR(r.periodo.fim)}, atualizado até ${dBR(r.dataCalculo)} segundo o Manual de Cálculos da Justiça Federal${r.descontos?.length ? `, já abatidos os valores recebidos no período (${moeda(r.descontosTotal.total)} atualizados)` : ""}, perfaz ${moeda(r.total)} (${reaisExtenso(r.total)}), sendo ${moeda(r.vencidas.corrigido)} de principal corrigido e ${moeda(r.vencidas.juros)} de juros de mora, conforme memória de cálculo anexa.`;
  }
  const v = r.vincendas;
  let txt = `Atribui-se à causa o valor de ${moeda(r.total)} (${reaisExtenso(r.total)}), correspondente à soma das parcelas vencidas desde ${dBR(r.periodo.inicio)}${p.decimoTerceiro ? ", acrescidas do abono anual," : ""} corrigidas monetariamente segundo o Manual de Cálculos da Justiça Federal${r.descontos?.length ? " e abatidos os valores já recebidos no período" : ""}, no importe de ${moeda(r.vencidas.total)}`;
  const nv = v ? v.parcelas + v.decimo : 0;
  const qtd = nv === 1 ? "da parcela vincenda" : `das ${nv === 2 ? "duas" : inteiroExtenso(nv)} parcelas vincendas`;
  txt += v && v.total ? `, e ${qtd}, no importe de ${moeda(v.total)}, na forma do art. 292, §§ 1º e 2º, do Código de Processo Civil` : ", na forma do art. 292, § 1º, do Código de Processo Civil";
  txt += ", conforme memória de cálculo anexa.";
  if (r.excedeJEF) txt += `\n\nA parte autora renuncia expressamente ao valor que excede sessenta salários mínimos na data do ajuizamento (${moeda(r.tetoJEF)}), para fins de fixação da competência do Juizado Especial Federal, nos termos do art. 3º da Lei nº 10.259/2001.`;
  return txt;
}

function resultadoHTML(C) {
  const r = C.res;
  const cli = C.cliente_id ? S.cli[C.cliente_id] : null;
  const proc = C.processo_id ? S.proc[C.processo_id] : null;
  const avisos = r.avisos.length ? `<div class="aviso aviso-info peq">${r.avisos.map(esc).join("<br>")}</div>` : "";
  const botoes = `<div class="calc-botoes">
    <button class="btn btn-primario btn-peq" id="c-salvar">${C.salvoId ? "Salvo" : "Salvar cálculo"}</button>
    ${proc && r.tipo === "previdenciario" && r.modo === "causa" ? `<button class="btn btn-sec btn-peq" id="c-valor-causa">Usar como valor da causa do processo</button>` : ""}
    <button class="btn btn-sec btn-peq" id="c-imprimir">Memória em PDF</button>
    <button class="btn btn-sec btn-peq" id="c-xlsx">Planilha Excel</button></div>`;
  const texto = `<div class="campo" style="margin-top:14px"><label for="c-texto">Texto para a petição</label><textarea id="c-texto" rows="8" readonly>${esc(textoPeticao(C))}</textarea>
    <button type="button" class="btn btn-sec btn-peq" id="c-copiar" style="justify-self:start">Copiar texto</button></div>`;
  if (r.tipo === "atualizacao") {
    const t = r.totais;
    return `<div class="cartao">
      <span class="rotulo">Total atualizado até ${dBR(r.dataCalculo)}</span>
      <div class="calc-total">${moeda(t.total)}</div>
      <dl class="calc-resumo">
        <dt>Valores originais</dt><dd>${moeda(t.valor)}</dd>
        <dt>Principal corrigido</dt><dd>${moeda(t.corrigido)}</dd>
        <dt>Juros de mora</dt><dd>${moeda(t.juros)}</dd>
        ${t.pago ? `<dt>Recebidos (${moeda(t.pagoValor)})</dt><dd class="neg">− ${moeda(t.pago)}</dd><dt>Saldo devedor</dt><dd>${moeda(t.subtotal)}</dd>` : ""}
        ${t.multa ? `<dt>Multa</dt><dd>${moeda(t.multa)}</dd>` : ""}${t.honorarios ? `<dt>Honorários</dt><dd>${moeda(t.honorarios)}</dd>` : ""}
      </dl>
      ${avisos}${botoes}${texto}
      <details class="calc-det" open><summary>Memória de cálculo</summary><div class="rolar"><table class="tabela-calc">
        <thead><tr><th>Descrição</th><th>Data</th><th>Valor</th><th>Fator</th><th>Corrigido</th><th>Juros %</th><th>Juros</th><th>Total</th></tr></thead>
        <tbody>${r.linhas.map((l) => `<tr><td>${esc(l.descricao || "-")}</td><td>${dBR(l.data)}</td><td>${moeda(l.valor)}</td><td>${pct(l.fator, 6)}</td><td>${moeda(l.corrigido)}</td><td>${pct(l.taxaJuros, 4)}</td><td>${moeda(l.juros)}</td><td><b>${moeda(l.total)}</b></td></tr>`).join("")}
        ${(r.pagos || []).map((l) => `<tr class="neg"><td>(−) ${esc(l.descricao || "Valor recebido")}</td><td>${dBR(l.data)}</td><td>${moeda(l.valor)}</td><td>${pct(l.fator, 6)}</td><td>${moeda(l.corrigido)}</td><td>${pct(l.taxaJuros, 4)}</td><td>${moeda(l.juros)}</td><td><b>− ${moeda(l.total)}</b></td></tr>`).join("")}</tbody>
      </table></div></details>
    </div>`;
  }
  const v = r.vincendas;
  const jef = r.modo === "causa" ? (r.excedeJEF
    ? `<div class="aviso aviso-erro peq">Excede o limite do JEF: 60 salários mínimos = ${moeda(r.tetoJEF)} (mínimo de ${moeda(r.salarioMinimo)}). O texto abaixo já traz a renúncia ao excedente; apague o parágrafo se a ação for para a Vara Federal.</div>`
    : `<div class="aviso aviso-ok peq">Dentro do limite do JEF: 60 salários mínimos = ${moeda(r.tetoJEF)}.</div>`) : "";
  return `<div class="cartao">
    <span class="rotulo">${r.modo === "causa" ? "Valor da causa" : `Atrasados atualizados até ${dBR(r.dataCalculo)}`}</span>
    <div class="calc-total">${moeda(r.total)}</div>
    <dl class="calc-resumo">
      <dt>Período</dt><dd>${r.periodo.fim ? `${dBR(r.periodo.inicio)} a ${dBR(r.periodo.fim)}` : "sem parcelas vencidas"}${r.periodo.prescritoAte ? ` <span class="mudo">(prescrito até ${dBR(r.periodo.prescritoAte)})</span>` : ""}</dd>
      ${r.descontos?.length ? `<dt>Vencidas (bruto)</dt><dd>${moeda(r.bruto.total)}</dd><dt>Valores já recebidos</dt><dd class="neg">− ${moeda(r.descontosTotal.total)}</dd>` : ""}
      <dt>Parcelas vencidas${r.descontos?.length ? " (líquido)" : ""}</dt><dd>${moeda(r.vencidas.devido)} <span class="mudo">sem correção</span></dd>
      <dt>Vencidas corrigidas</dt><dd>${moeda(r.vencidas.corrigido)}</dd>
      ${r.modo === "atrasados" ? `<dt>Juros de mora</dt><dd>${moeda(r.vencidas.juros)}</dd>` : ""}
      ${v ? `<dt>Vincendas</dt><dd>${v.parcelas}${v.decimo ? " + 13º" : ""} × ${moeda(v.valorMensal)} = ${moeda(v.total)}</dd>` : ""}
    </dl>
    ${jef}${avisos}${botoes}${texto}
    <details class="calc-det"><summary>Parcela a parcela (${r.linhas.length + (r.descontos?.length || 0)} linhas)</summary><div class="rolar"><table class="tabela-calc">
      <thead><tr><th>Competência</th><th>Devido</th><th>Fator</th><th>Corrigido</th>${r.modo === "atrasados" ? "<th>Juros</th>" : ""}<th>Total</th></tr></thead>
      <tbody>${r.linhas.map((l) => `<tr${l.decimo ? ' class="d13"' : ""}><td>${esc(l.rotulo)}${l.dias ? ` <span class="mudo">(${l.dias} dias)</span>` : ""}</td><td>${moeda(l.devido)}</td><td>${pct(l.fator, 6)}</td><td>${moeda(l.corrigido)}</td>${r.modo === "atrasados" ? `<td>${moeda(l.juros)}</td>` : ""}<td><b>${moeda(l.total)}</b></td></tr>`).join("")}
      ${(r.descontos || []).map((l) => `<tr class="neg"><td>(−) ${esc(l.rotulo)}${l.dias ? ` <span class="mudo">(${l.dias} dias)</span>` : ""}</td><td>${moeda(l.devido)}</td><td>${pct(l.fator, 6)}</td><td>${moeda(l.corrigido)}</td>${r.modo === "atrasados" ? `<td>${moeda(l.juros)}</td>` : ""}<td><b>− ${moeda(l.total)}</b></td></tr>`).join("")}</tbody>
      <tfoot><tr><th>${r.descontos?.length ? "Total líquido" : "Total"}</th><th>${moeda(r.vencidas.devido)}</th><th></th><th>${moeda(r.vencidas.corrigido)}</th>${r.modo === "atrasados" ? `<th>${moeda(r.vencidas.juros)}</th>` : ""}<th>${moeda(r.vencidas.total)}</th></tr></tfoot>
    </table></div>
    ${r.reajustes.length ? `<p class="peq mudo" style="margin-top:8px">Reajustes aplicados: ${r.reajustes.map((x) => `${x.ano}: ${pct(x.percentual, 2)}% (${moeda(x.valor)})`).join("; ")}.</p>` : ""}
    </details>
  </div>`;
}

function tituloCalculo(C) {
  const p = C.params, r = C.res;
  const nome = C.cliente_id && S.cli[C.cliente_id] ? S.cli[C.cliente_id].nome + " · " : "";
  if (r.tipo === "atualizacao") return `${nome}Atualização até ${dBR(r.dataCalculo)}`;
  return `${nome}${r.modo === "causa" ? "Valor da causa" : "Atrasados"} · ${ESPECIES[p.especie]?.nome || "Benefício"} · DIB ${dBR(p.dib)}`;
}

function ligarResultado(C) {
  const r = C.res;
  app.querySelector("#c-copiar").onclick = async () => {
    const t = app.querySelector("#c-texto");
    try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand("copy"); }
    toast("Texto copiado.");
  };
  app.querySelector("#c-salvar").onclick = async (e) => {
    if (C.salvoId) return toast("Este cálculo já está salvo.");
    e.target.disabled = true;
    const total = r.tipo === "atualizacao" ? r.totais.total : r.total;
    const ins = await db.from("calculos").insert({ cliente_id: C.cliente_id, processo_id: C.processo_id, tipo: r.tipo, titulo: tituloCalculo(C),
      parametros: C.params, resultado: r, total, criado_por: S.advogado?.nome || null }).select().single();
    e.target.disabled = false;
    if (ins.error) return toast(ins.error.message, true);
    C.salvoId = ins.data.id; e.target.textContent = "Salvo"; toast("Cálculo salvo."); listarCalculosSalvos();
  };
  app.querySelector("#c-valor-causa")?.addEventListener("click", async () => {
    const up = await db.from("processos").update({ valor_causa: r.total }).eq("id", C.processo_id);
    if (up.error) return toast(up.error.message, true);
    S.proc[C.processo_id].valor_causa = r.total;
    toast(`Valor da causa gravado no processo: ${moeda(r.total)}.`);
  });
  app.querySelector("#c-imprimir").onclick = () => imprimirMemoria(C);
  app.querySelector("#c-xlsx").onclick = () => planilhaCalculo(C);
}

async function listarCalculosSalvos() {
  const box = app.querySelector("#c-salvos");
  if (!box) return;
  const q = await db.from("calculos").select("id,cliente_id,processo_id,tipo,titulo,total,criado_por,criado_em").order("criado_em", { ascending: false }).limit(40);
  if (q.error) { box.innerHTML = `<div class="aviso aviso-erro">${esc(q.error.message)}</div>`; return; }
  if (!q.data.length) { box.innerHTML = '<div class="vazio">Nenhum cálculo salvo ainda.</div>'; return; }
  box.innerHTML = `<div class="lista">${q.data.map((c) => `<div class="item"><div class="principal"><b>${esc(c.titulo)}</b>
      <div class="sec">${moeda(c.total)} · ${dataBR(c.criado_em)}${c.criado_por ? " · " + esc(primeiroNome(c.criado_por)) : ""}${c.processo_id && S.proc[c.processo_id] ? " · " + esc(S.proc[c.processo_id].titulo) : ""}</div></div>
      <div class="dir"><button class="btn btn-sec btn-peq" data-abrir-calc="${c.id}">Abrir</button><button class="x" data-del-calc="${c.id}" title="Excluir" aria-label="Excluir">×</button></div></div>`).join("")}</div>`;
  box.querySelectorAll("[data-abrir-calc]").forEach((b) => (b.onclick = async () => {
    const r = await db.from("calculos").select("*").eq("id", b.dataset.abrirCalc).single();
    if (r.error) return toast(r.error.message, true);
    const c = r.data;
    const aba = c.parametros.aba || (c.tipo === "atualizacao" ? "atualizacao" : c.parametros.modo || "causa");
    S.calc = { aba, params: { ...paramsPadrao(aba), ...c.parametros }, res: c.resultado, cliente_id: c.cliente_id, processo_id: c.processo_id, salvoId: c.id };
    telaCalculos();
  }));
  box.querySelectorAll("[data-del-calc]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Excluir este cálculo salvo?")) return;
    const r = await db.from("calculos").delete().eq("id", b.dataset.delCalc);
    if (r.error) return toast(r.error.message, true);
    if (S.calc?.salvoId === b.dataset.delCalc) S.calc.salvoId = null;
    listarCalculosSalvos();
  }));
}

function metodologia(C) {
  const r = C.res, p = C.params;
  if (r.tipo === "atualizacao") {
    const reg = {
      lei14905: "Correção monetária pelo INPC até agosto de 2024 e pelo IPCA a partir de setembro de 2024 (art. 389, parágrafo único, do Código Civil, na redação da Lei nº 14.905/2024).",
      selic: "Taxa SELIC acumulada mensalmente de forma simples, abrangendo correção monetária e juros.",
      nenhum: "Sem correção monetária.",
    }[r.regime] || `Correção monetária pelo ${NOMES_INDICE[r.regime]}, acumulado mês a mês a partir do mês de cada valor até o mês anterior ao da atualização.`;
    const jur = {
      regime: "Juros de mora simples de 1% ao mês até 29/08/2024 e, a partir de 30/08/2024, pela taxa legal do art. 406 do Código Civil divulgada pelo Banco Central (Resolução CMN nº 5.171/2024), proporcionais aos dias.",
      nenhum: "Sem juros de mora.", um: "Juros de mora simples de 1% ao mês, proporcionais aos dias.", meio: "Juros de mora simples de 0,5% ao mês, proporcionais aos dias.",
      legal: "Juros de mora pela taxa legal do art. 406 do Código Civil divulgada pelo Banco Central (Resolução CMN nº 5.171/2024), proporcionais aos dias.",
    }[r.juros];
    const pg = r.pagos?.length ? ["Valores recebidos atualizados pelos mesmos critérios de correção e juros desde a data de cada pagamento e abatidos do débito na data do cálculo."] : [];
    return [...pg, reg, jur + (p.jurosDesde && r.juros !== "nenhum" ? ` Termo inicial dos juros: ${dBR(p.jurosDesde)}.` : r.juros !== "nenhum" ? " Termo inicial dos juros: data de cada valor." : ""),
      "Índices negativos de deflação são aplicados sem reduzir o valor nominal."];
  }
  const e = ESPECIES[p.especie];
  const base = [
    `Benefício: ${e?.nome || "-"}. DIB ${dBR(p.dib)}${p.dcb ? `, cessação em ${dBR(p.dcb)}` : ""}. ${p.rmiModo === "sm" ? "Renda mensal de um salário mínimo, conforme o valor vigente em cada competência." : `RMI de ${moeda(p.rmi)} na DIB, reajustada anualmente pelo INPC, proporcionalmente no primeiro reajuste (art. 41-A da Lei nº 8.213/1991)${p.pisoSM ? ", observado o piso do salário mínimo" : ""}.`}`,
    p.prescricao ? "Prescrição quinquenal contada da data do ajuizamento (art. 103, parágrafo único, da Lei nº 8.213/1991)." : "Sem aplicação de prescrição.",
    p.decimoTerceiro ? "Abono anual calculado sobre a renda de dezembro, ou do último mês do período, à razão de 1/12 por mês com 15 dias ou mais de benefício." : "Sem abono anual.",
    "Correção monetária conforme o Manual de Cálculos da Justiça Federal (Resolução CJF nº 990/2026): INPC até novembro de 2021; taxa SELIC, acumulada de forma simples, de dezembro de 2021 a agosto de 2025 (art. 3º da EC nº 113/2021, na redação original); INPC a partir de setembro de 2025. Índices contados do mês do vencimento de cada parcela até o mês anterior ao do cálculo; a deflação não reduz o valor nominal.",
  ];
  if (r.descontos?.length) base.push("Valores já recebidos no período (" + (p.descontos || []).map((d) => `${d.descricao || "benefício"} de ${dBR(d.inicio)} a ${dBR(d.fim)}, ${d.modo === "sm" ? "um salário mínimo" : moeda(d.valor)} por mês${d.decimo ? ", com abono anual" : ""}`).join("; ") + ") abatidos mês a mês, com a mesma correção e os mesmos juros das parcelas devidas.");
  if (r.modo === "atrasados") base.push(p.citacao ? `Juros de mora desde a citação (${dBR(p.citacao)}): até novembro de 2021, os juros aplicados à caderneta de poupança; de dezembro de 2021 a agosto de 2025, englobados na SELIC; a partir de setembro de 2025, taxa legal correspondente ao fator SELIC do mês deduzido o INPC do mês anterior, sem valores negativos.` : "Sem juros de mora (data da citação não informada).");
  else base.push(`Parcelas vencidas até o mês anterior ao do ajuizamento, atualizadas até ${dBR(p.ajuizamento)}.${r.vincendas ? ` Vincendas: ${r.vincendas.parcelas}${r.vincendas.decimo ? " parcelas e um abono anual" : " parcelas"} pela renda da competência do ajuizamento (art. 292, §§ 1º e 2º, do CPC).` : ""}`);
  return base;
}

async function planilhaCalculo(C) {
  try { await carregarXLSX(); } catch { return toast("Não consegui carregar o gerador de planilhas.", true); }
  const r = C.res;
  const linhas = [[tituloCalculo(C)], ["Data do cálculo", dBR(r.dataCalculo)], []];
  if (r.tipo === "atualizacao") {
    linhas.push(["Descrição", "Data", "Valor original", "Fator de correção", "Valor corrigido", "Juros (%)", "Juros", "Total"]);
    r.linhas.forEach((l) => linhas.push([l.descricao, dBR(l.data), l.valor, Number(l.fator.toFixed(6)), l.corrigido, Number(l.taxaJuros.toFixed(4)), l.juros, l.total]));
    (r.pagos || []).forEach((l) => linhas.push(["(−) " + (l.descricao || "Valor recebido"), dBR(l.data), -l.valor, Number(l.fator.toFixed(6)), -l.corrigido, Number(l.taxaJuros.toFixed(4)), -l.juros, -l.total]));
    const t = r.totais;
    linhas.push([], ["Principal corrigido", "", "", "", t.corrigido], ["Juros", "", "", "", t.juros], ...(t.pago ? [["(−) Recebidos atualizados", "", "", "", -t.pago], ["Saldo devedor", "", "", "", t.subtotal]] : []), ["Multa", "", "", "", t.multa], ["Honorários", "", "", "", t.honorarios], ["Total", "", "", "", t.total]);
  } else {
    linhas.push(["Competência", "Renda mensal", "Dias", "Valor devido", "Fator de atualização", "Valor corrigido", "Juros", "Total"]);
    r.linhas.forEach((l) => linhas.push([l.rotulo, l.base, l.dias || "", l.devido, Number(l.fator.toFixed(6)), l.corrigido, l.juros, l.total]));
    (r.descontos || []).forEach((l) => linhas.push(["(−) " + l.rotulo, l.base, l.dias || "", -l.devido, Number(l.fator.toFixed(6)), -l.corrigido, -l.juros, -l.total]));
    linhas.push([], ["Vencidas", "", "", r.vencidas.devido, "", r.vencidas.corrigido, r.vencidas.juros, r.vencidas.total]);
    if (r.vincendas) linhas.push([`Vincendas (${r.vincendas.parcelas}${r.vincendas.decimo ? " + 13º" : ""} × ${moeda(r.vincendas.valorMensal)})`, "", "", "", "", "", "", r.vincendas.total]);
    linhas.push(["Total", "", "", "", "", "", "", r.total]);
  }
  linhas.push([], ...metodologia(C).map((t) => [t]));
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  ws["!cols"] = [{ wch: 26 }, { wch: 14 }, { wch: 10 }, { wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Cálculo");
  XLSX.writeFile(wb, "calculo-" + norm(tituloCalculo(C)).replace(/[^a-z0-9]+/g, "-").slice(0, 60) + ".xlsx");
}

const NOME_TRIB = (n) => {
  const d = String(n || "").replace(/\D/g, "");
  if (d.length !== 20) return "";
  const j = d[13], tr = d.slice(14, 16);
  if (j === "8") return { "24": "TJSC", "16": "TJPR", "21": "TJRS", "26": "TJSP" }[tr] || "TJ";
  if (j === "4") return "TRF" + Number(tr);
  if (j === "5") return "TRT" + Number(tr);
  return "";
};

// ================= JURISPRUDÊNCIA =================
const TRIBUNAIS_J = ["TJSC", "STJ", "STF", "TRF4", "TNU", "TJPR", "TRT12", "TST", "TJRS"];
const TIPOS_J = { acordao: "Acórdão", sumula: "Súmula", tema: "Tema repetitivo / repercussão geral", irdr: "IRDR", iac: "IAC", enunciado: "Enunciado", decisao: "Decisão monocrática" };
const dataCit = (d, sep = "-") => (d ? d.split("-").reverse().join(sep) : "");

function citacaoJ(j) {
  if (j.tipo === "sumula") return `Súmula n. ${j.numero || ""} do ${j.tribunal}`;
  if (j.tipo === "tema") return `Tema n. ${j.numero || ""} do ${j.tribunal}`;
  if (j.tipo === "irdr") return `IRDR n. ${j.numero || ""} (${j.tribunal})`;
  if (j.tipo === "iac") return `IAC n. ${j.numero || ""} (${j.tribunal})`;
  if (j.tipo === "enunciado") return `Enunciado n. ${j.numero || ""} (${j.tribunal})`;
  const partes = [j.tribunal, [j.classe, j.numero ? "n. " + j.numero : ""].filter(Boolean).join(" "), j.relator ? "rel. " + j.relator : "", j.orgao, j.data_julgamento ? "j. " + dataCit(j.data_julgamento, j.tribunal === "TJSC" ? "-" : "/") : ""];
  return "(" + partes.filter(Boolean).join(", ") + ")";
}

// Lê a citação padrão do tribunal colada junto com a ementa
function extrairJulgado(texto) {
  const t = String(texto || "").replace(/\r/g, "").trim();
  const r = { ementa: t };
  const dataISO = (s) => { const m = String(s).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : ""; };
  // TJSC: (TJSC, Apelação n. 5000000-00.2020.8.24.0002, do Tribunal de Justiça de Santa Catarina, rel. Fulano, Quarta Câmara de Direito Civil, j. 10-03-2025).
  let m = t.match(/\((TJSC|TJPR|TJRS|TRF4|STJ|STF)\s*,\s*([^,()]+?)\s+n[º°.]*\s*([\d.\-\/]+)\s*,(?:\s*do\s+Tribunal[^,]*,)?\s*rel(?:ator[a]?)?\.?\s*(?:Des(?:a|embargador[a]?)?\.?\s*|Min(?:istr[oa])?\.?\s*|Juiz[a]?\s*)?([^,]+),\s*([^,]+?),\s*j\.?\s*([\d\-\/.]+)\s*\)\.?/i);
  if (m) {
    Object.assign(r, { tribunal: m[1].toUpperCase(), classe: m[2].trim(), numero: m[3].trim(), relator: m[4].trim(), orgao: m[5].trim(), data_julgamento: dataISO(m[6]) });
    r.ementa = t.replace(m[0], "").trim();
  } else {
    // STJ/STF: (REsp n. 1.234.567/SC, relator Ministro Fulano, Terceira Turma, julgado em 1/2/2024, DJe de 5/2/2024.)
    m = t.match(/\(([A-Za-zÀ-ú ]+?)\s+n[º°.]*\s*([\d.\-\/A-Z]+)\s*,\s*relator[a]?\s+(?:Ministr[oa]\s+)?([^,]+),\s*([^,]+),\s*julgado em\s*([\d\/.\-]+)[^)]*\)\.?/i);
    if (m) {
      Object.assign(r, { tribunal: /^(RE|ARE|ADI|ADPF|HC|RHC|MS)\b/.test(m[1]) && /STF/i.test(t) ? "STF" : "STJ", classe: m[1].trim(), numero: m[2].trim(), relator: "Min. " + m[3].trim(), orgao: m[4].trim(), data_julgamento: dataISO(m[5]) });
      r.ementa = t.replace(m[0], "").trim();
    } else {
      const cnj = t.match(/\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/);
      if (cnj) r.numero = cnj[0];
      const rel = t.match(/Rel(?:ator[a]?)?\.?\s*:?\s*(?:Des(?:a|embargador[a]?)?\.?\s*)?([A-ZÀ-Ú][^,\n;]+)/);
      if (rel) r.relator = rel[1].trim();
      const dj = t.match(/(?:julgado em|j\.)\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4})/i);
      if (dj) r.data_julgamento = dataISO(dj[1]);
      const cam = t.match(/((?:Primeira|Segunda|Terceira|Quarta|Quinta|Sexta|Sétima|Oitava|\d+ª)\s+(?:Câmara|Turma)[^,\n;)]*)/i);
      if (cam) r.orgao = cam[1].trim();
    }
  }
  const cl = (r.ementa.match(/^\s*(APELAÇÃO CÍVEL|APELAÇÃO CRIMINAL|AGRAVO DE INSTRUMENTO|AGRAVO INTERNO|RECURSO INOMINADO|EMBARGOS DE DECLARAÇÃO|HABEAS CORPUS|MANDADO DE SEGURANÇA|RECURSO EM SENTIDO ESTRITO)/i) || [])[1];
  if (!r.classe && cl) r.classe = cl.charAt(0) + cl.slice(1).toLowerCase();
  r.ementa = r.ementa.replace(/\n{3,}/g, "\n\n").trim();
  return r;
}

async function copiarJulgado(j, soCitacao) {
  if (!j.conferido && !confirm("Este julgado ainda não foi marcado como conferido no site do tribunal. Copiar mesmo assim?")) return;
  const cit = citacaoJ(j);
  const texto = soCitacao ? cit : `${j.ementa} ${cit}`;
  const html = soCitacao ? esc(cit) : `<p style="text-align:justify"><i>${esc(j.ementa).replace(/\n/g, "<br>")}</i> ${esc(cit)}</p>`;
  try {
    await navigator.clipboard.write([new ClipboardItem({ "text/plain": new Blob([texto], { type: "text/plain" }), "text/html": new Blob([html], { type: "text/html" }) })]);
  } catch {
    try { await navigator.clipboard.writeText(texto); } catch { return toast("Não consegui copiar.", true); }
  }
  toast(soCitacao ? "Citação copiada." : "Ementa copiada em itálico, com a citação. Cole na petição.");
}

    <div class="campo"><label for="jd-tese">Tese em uma frase</label><input id="jd-tese" name="tese" type="text" value="${esc(j.tese || "")}" placeholder="Ex.: Pensão mensal devida à família da vítima de acidente de trânsito até a idade provável de 75 anos"></div>
    <div class="campo"><label for="jd-ementa">Ementa</label><textarea id="jd-ementa" name="ementa" style="min-height:150px" required>${esc(j.ementa || "")}</textarea></div>
    <div class="campo"><label for="jd-tags">Palavras-chave</label><input id="jd-tags" name="tags" type="text" value="${esc((j.tags || []).join(", "))}" placeholder="separadas por vírgula: pensão, acidente, lucros cessantes"></div>
    <div class="campo"><label for="jd-obs">Nota interna</label><textarea id="jd-obs" name="observacoes" style="min-height:56px" placeholder="Ex.: usado no caso Kelly; câmara favorável ao consumidor">${esc(j.observacoes || "")}</textarea></div>
    <label class="check"><input type="checkbox" name="conferido" ${j.conferido ? "checked" : ""}><span><b>Conferi no site do tribunal</b> o número, o relator, a data e a ementa.</span></label>
    <div class="dlg-botoes">
      ${novo ? "" : '<button type="button" class="btn btn-perigo btn-peq" id="jd-excluir">Excluir</button>'}
      <div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
    </div>
  </form>`, async (f) => {
    const ementa = val(f, "ementa");
    if (!ementa) return toast("Cole a ementa.", true);
    if (!urlOk(val(f, "link"))) return toast("O link deve começar com https://", true);
    const dados = { tribunal: val(f, "tribunal"), tipo: val(f, "tipo"), area: val(f, "area") || null, classe: val(f, "classe") || null, numero: val(f, "numero") || null,
      relator: val(f, "relator") || null, orgao: val(f, "orgao") || null, data_julgamento: val(f, "data_julgamento") || null, link: val(f, "link") || null,
      tese: val(f, "tese") || null, ementa, tags: val(f, "tags").split(",").map((t) => t.trim().toLowerCase()).filter(Boolean), observacoes: val(f, "observacoes") || null,
      conferido: f.elements.conferido.checked };
    const r = novo ? await db.from("jurisprudencia").insert(dados).select().single() : await db.from("jurisprudencia").update(dados).eq("id", j.id).select().single();
    if (r.error) return toast(/jurisprudencia_unica/.test(r.error.message) ? "Esse julgado já está no banco." : r.error.message, true);
    dlg.close(); toast("Julgado salvo."); depois && depois();
  }, true);
  const f = dlg.querySelector("form");
  dlg.querySelector("#jd-ler")?.addEventListener("click", () => {
    const x = extrairJulgado(dlg.querySelector("#jd-colar").value);
    if (!x.ementa) return toast("Cole o texto primeiro.", true);
    if (x.tribunal && TRIBUNAIS_J.includes(x.tribunal)) f.elements.tribunal.value = x.tribunal;
    for (const k of ["classe", "numero", "relator", "orgao", "data_julgamento", "ementa"]) if (x[k]) f.elements[k].value = x[k];
    const achou = ["numero", "relator", "orgao", "data_julgamento"].filter((k) => x[k]).length;
    toast(achou >= 3 ? "Campos preenchidos. Confira e escreva a tese." : "Preenchi o que consegui. Complete os campos que faltaram.");
  });
  dlg.querySelector("#jd-excluir")?.addEventListener("click", async () => {
    if (!confirm("Excluir este julgado do banco?")) return;
    const r = await db.from("jurisprudencia").delete().eq("id", j.id);
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast("Excluído."); depois && depois();
  });
}

function dialogoUsarJulgado(j) {
  const ops = S.processos.filter((p) => !p.arquivado).map((p) => ({ id: p.id, rot: `${S.cli[p.cliente_id]?.nome || ""} · ${p.titulo}${p.numero ? " · " + p.numero : ""}` }))
    .sort((a, b) => a.rot.localeCompare(b.rot, "pt-BR"));
  abrir(`<form novalidate><h2>Usar em processo</h2>
    <p class="peq mudo" style="margin:-8px 0 12px">${esc(j.tese || citacaoJ(j))}</p>
    <div class="campo"><label for="uj-p">Processo</label><input id="uj-p" name="p" type="search" list="uj-lista" required placeholder="Digite o cliente ou o número">
      <datalist id="uj-lista">${ops.map((o) => `<option value="${esc(o.rot)}"></option>`).join("")}</datalist></div>
    <div class="dlg-botoes"><div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Vincular</button></div></div></form>`, async (f) => {
    const o = ops.find((x) => x.rot === val(f, "p"));
    if (!o) return toast("Escolha um processo da lista.", true);
    const r = await db.from("jurisprudencia_processos").insert({ jurisprudencia_id: j.id, processo_id: o.id });

    dlg.close(); toast("Julgado vinculado ao processo.");
  });
}

// ================= DESPESAS DO ESCRITÓRIO =================
const CATEGORIAS_DESP = ["Aluguel", "Energia e água", "Internet e telefone", "Sistemas e assinaturas", "Custas processuais", "Perícias e assistentes técnicos",
  "Cartório e certidões", "Diligências e deslocamento", "Combustível", "Correios", "Material de escritório", "Contador", "OAB e anuidades",
  "Impostos e taxas", "Marketing e site", "Pessoal", "Manutenção", "Outros"];
const FORMAS_DESP = ["Pix", "Cartão de crédito", "Cartão de débito", "Boleto", "Transferência", "Dinheiro", "Débito automático"];
const MESES_NOME = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const mesRotulo = (m) => { const [a, mm] = m.split("-").map(Number); return MESES_NOME[mm - 1].replace(/^./, (x) => x.toUpperCase()) + " de " + a; };
const mesSomar = (m, n) => { const [a, mm] = m.split("-").map(Number); const d = new Date(Date.UTC(a, mm - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const fimMes = (m) => { const [a, mm] = m.split("-").map(Number); return new Date(Date.UTC(a, mm, 0)).toISOString().slice(0, 10); };

async function telaDespesas() {
  const F = (S.despF ||= { mes: HOJE().slice(0, 7), categoria: "", status: "", q: "" });
  const ini = F.mes + "-01", fim = fimMes(F.mes);
  app.innerHTML = '<div class="carregando">Carregando despesas...</div>';
  const [dq, pq, rq, aq] = await Promise.all([
    db.from("despesas").select("*").gte("data", ini).lte("data", fim).order("data", { ascending: false }),
    db.from("parcelas").select("valor,pago_em").gte("pago_em", ini).lte("pago_em", fim),
    db.from("despesas").select("*").eq("reembolsavel", true).eq("reembolsado", false).order("data", { ascending: false }).limit(200),
    db.from("despesas").select("valor,data,pago").gte("data", mesSomar(F.mes, -5) + "-01").lte("data", fim),
  ]);
  if (dq.error) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc(dq.error.message)}. Confira se o script 14 (despesas) foi executado no Supabase.</div></div>`);
  const todas = dq.data;
  const hoje = HOJE();
  const soma = (l) => l.reduce((s, d) => s + Number(d.valor), 0);
  const pagas = todas.filter((d) => d.pago), abertas = todas.filter((d) => !d.pago);
  const vencidas = abertas.filter((d) => d.data < hoje);
  const recebido = soma(pq.data || []);
  const resultado = recebido - soma(pagas);
  const aReembolsar = (rq.data || []);
  const porCat = {};
  todas.forEach((d) => (porCat[d.categoria] = (porCat[d.categoria] || 0) + Number(d.valor)));
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;
  const totalMes = soma(todas);
  // evolução dos últimos 6 meses
  const meses6 = Array.from({ length: 6 }, (_, i) => mesSomar(F.mes, i - 5));
  const porMes = Object.fromEntries(meses6.map((m) => [m, 0]));
  (aq.data || []).forEach((d) => { const m = d.data.slice(0, 7); if (m in porMes) porMes[m] += Number(d.valor); });
  const max6 = Math.max(1, ...Object.values(porMes));

  const lista = todas.filter((d) => (!F.categoria || d.categoria === F.categoria)
    && (!F.status || (F.status === "pago" ? d.pago : F.status === "aberto" ? !d.pago : F.status === "reembolso" ? d.reembolsavel && !d.reembolsado : true))
    && (!F.q || norm([d.descricao, d.fornecedor, d.categoria, d.observacoes, S.cli[d.cliente_id]?.nome].join(" ")).includes(norm(F.q))));

  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra"><div><h1>Despesas</h1><p class="mudo peq">Lance as despesas do escritório. As marcadas como "repete todo mês" são lançadas de novo com um clique.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" id="dp-xlsx">Exportar Excel</button><button class="btn btn-primario" id="dp-nova">+ Nova despesa</button></div></div>
    <div class="mes-nav"><button class="btn btn-sec btn-peq" id="dp-ant" aria-label="Mês anterior">◀</button><b>${mesRotulo(F.mes)}</b><button class="btn btn-sec btn-peq" id="dp-prox" aria-label="Próximo mês">▶</button>
      ${F.mes !== HOJE().slice(0, 7) ? '<button class="btn btn-sec btn-peq" id="dp-hoje">Mês atual</button>' : ""}
      <button class="btn btn-sec btn-peq" id="dp-rec" title="Lança neste mês as despesas marcadas como recorrentes">Lançar recorrentes do mês</button></div>

    <form class="dp-rapida" id="dp-rapida" autocomplete="off">
      <input name="descricao" type="text" placeholder="Lançamento rápido: descrição" aria-label="Descrição" required>
      <input name="valor" type="text" data-mask="moeda" inputmode="decimal" placeholder="R$ 0,00" aria-label="Valor" required>
      <select name="categoria" aria-label="Categoria">${CATEGORIAS_DESP.map((c) => `<option>${c}</option>`).join("")}</select>
      <input name="data" type="date" value="${F.mes === hoje.slice(0, 7) ? hoje : ini}" aria-label="Data">
      <button class="btn btn-primario" type="submit">Lançar</button>
    </form>

    <div class="cards">
      <div class="card-num"><div class="n">${moeda(totalMes)}</div><div class="l">despesas do mês (${todas.length})</div></div>
      <div class="card-num"><div class="n">${moeda(soma(pagas))}</div><div class="l">pagas</div></div>
      <div class="card-num ${vencidas.length ? "alerta" : abertas.length ? "aviso" : ""}"><div class="n">${moeda(soma(abertas))}</div><div class="l">a pagar${vencidas.length ? ` (${vencidas.length} vencida${vencidas.length === 1 ? "" : "s"})` : ""}</div></div>
      <div class="card-num"><div class="n">${moeda(recebido)}</div><div class="l">honorários recebidos no mês</div></div>
      <div class="card-num ${resultado < 0 ? "alerta" : ""}"><div class="n">${moeda(resultado)}</div><div class="l">resultado (recebido menos pago)</div></div>
      <div class="card-num ${aReembolsar.length ? "aviso" : ""}"><div class="n">${moeda(soma(aReembolsar))}</div><div class="l">adiantado para clientes, a reembolsar</div></div>
    </div>

    <div class="colunas">
      <div class="bloco"><h2 style="margin-bottom:10px">Por categoria</h2>
        ${cats.length ? `<div class="lista dp-cats">${cats.map(([c, v]) => `<button type="button" class="dp-cat ${F.categoria === c ? "sel" : ""}" data-cat="${esc(c)}">
          <span class="nome">${esc(c)}</span><span class="barra-v"><i style="width:${Math.max(3, (v / maxCat) * 100)}%"></i></span><span class="v">${moeda(v)} <small>${totalMes ? Math.round((v / totalMes) * 100) : 0}%</small></span></button>`).join("")}</div>`
          : '<div class="vazio peq">Sem despesas neste mês.</div>'}
      </div>
      <div class="bloco"><h2 style="margin-bottom:10px">Últimos 6 meses</h2>
        <div class="dp-meses">${meses6.map((m) => `<button type="button" class="dp-mes ${m === F.mes ? "sel" : ""}" data-mes="${m}" title="${mesRotulo(m)}: ${moeda(porMes[m])}">
          <span class="col"><i style="height:${Math.max(2, (porMes[m] / max6) * 100)}%"></i></span><span class="v">${porMes[m] ? moeda(porMes[m]).replace(/,\d\d$/, "") : "-"}</span><span class="m">${MESES_NOME[Number(m.slice(5)) - 1].slice(0, 3)}</span></button>`).join("")}</div>
      </div>
    </div>

    <div class="barra" style="margin-top:6px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;flex:1">
        <input type="search" id="dp-busca" value="${esc(F.q)}" placeholder="Buscar descrição, fornecedor ou cliente" aria-label="Buscar" style="max-width:300px">
        <select id="dp-cat" style="width:auto" aria-label="Categoria"><option value="">Todas as categorias</option>${CATEGORIAS_DESP.map((c) => `<option ${F.categoria === c ? "selected" : ""}>${c}</option>`).join("")}</select>
        <select id="dp-status" style="width:auto" aria-label="Situação"><option value="">Todas</option><option value="pago" ${F.status === "pago" ? "selected" : ""}>Pagas</option><option value="aberto" ${F.status === "aberto" ? "selected" : ""}>A pagar</option><option value="reembolso" ${F.status === "reembolso" ? "selected" : ""}>A reembolsar</option></select>
      </div>
      <span class="peq mudo">${lista.length} lançamento${lista.length === 1 ? "" : "s"} · ${moeda(soma(lista))}</span>
    </div>
    ${lista.length ? `<div class="lista">${lista.map((d) => {
      const c = d.cliente_id && S.cli[d.cliente_id];
      const venc = !d.pago && d.data < hoje;
      return `<div class="item dp-item ${d.pago ? "" : venc ? "vencida" : "aberta"}">
        <div class="dp-data"><b>${d.data.slice(8)}</b><small>${MESES_NOME[Number(d.data.slice(5, 7)) - 1].slice(0, 3)}</small></div>
        <div class="principal" style="flex:1"><b>${esc(d.descricao)}</b> <span class="tag tag-oculto">${esc(d.categoria)}</span>${d.recorrente ? ' <span class="tag tag-audiencia" title="Repete todo mês">mensal</span>' : ""}${d.origem_id ? ' <span class="tag tag-oculto" title="Lançada a partir de uma recorrente">recorrente</span>' : ""}
          <div class="sec">${[esc(d.fornecedor || ""), esc(d.forma || ""), c ? `cliente: <a href="#cliente/${c.id}">${esc(c.nome)}</a>${d.reembolsavel ? (d.reembolsado ? " (reembolsada)" : " (a reembolsar)") : ""}` : "", esc(d.observacoes || "")].filter(Boolean).join(" · ")}</div></div>
        <div class="dp-valor"><b>${moeda(d.valor)}</b><small class="${d.pago ? "ok" : venc ? "err" : "warn"}">${d.pago ? "paga" : venc ? "vencida" : "a pagar"}</small></div>
        <div class="dir">
          ${d.comprovante_url ? `<a class="btn btn-sec btn-peq" href="${esc(d.comprovante_url)}" target="_blank" rel="noopener">Comprovante</a>` : ""}
          ${d.pago ? "" : `<button class="btn btn-primario btn-peq" data-dp-pagar="${d.id}">Paga</button>`}
          ${d.reembolsavel && !d.reembolsado ? `<button class="btn btn-sec btn-peq" data-dp-reemb="${d.id}">Reembolsada</button>` : ""}
          <button class="btn btn-sec btn-peq" data-dp-editar="${d.id}">Editar</button>
          <button class="btn btn-sec btn-peq" data-dp-dup="${d.id}" title="Lançar de novo no próximo mês">Repetir</button>
        </div></div>`;
    }).join("")}</div>` : `<div class="vazio">${todas.length ? "Nenhuma despesa com esses filtros." : "Nenhuma despesa lançada em " + mesRotulo(F.mes).toLowerCase() + ". Use o lançamento rápido acima."}</div>`}
    ${aReembolsar.length ? `<div class="bloco" style="margin-top:24px"><h2 style="margin-bottom:10px">Adiantado para clientes, a reembolsar (todos os meses)</h2><div class="lista">${aReembolsar.map((d) => {
      const c = d.cliente_id && S.cli[d.cliente_id];
      return `<div class="item"><div class="principal"><b>${esc(d.descricao)}</b> · ${moeda(d.valor)}<div class="sec">${dBR(d.data)}${c ? ` · <a href="#cliente/${c.id}">${esc(c.nome)}</a>` : ""}${d.processo_id && S.proc[d.processo_id] ? " · " + esc(S.proc[d.processo_id].titulo) : ""}</div></div>
        <div class="dir">${c?.whatsapp ? botaoWhats(c.whatsapp, `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia. Adiantamos ${moeda(d.valor)} referente a ${d.descricao} no seu processo. Podemos combinar o reembolso?`, "Cobrar") : ""}<button class="btn btn-sec btn-peq" data-dp-reemb="${d.id}">Reembolsada</button></div></div>`;
    }).join("")}</div></div>` : ""}
  </div>`;

  const ir = (m) => { F.mes = m; telaDespesas(); };
  app.querySelector("#dp-ant").onclick = () => ir(mesSomar(F.mes, -1));
  app.querySelector("#dp-prox").onclick = () => ir(mesSomar(F.mes, 1));
  app.querySelector("#dp-hoje")?.addEventListener("click", () => ir(HOJE().slice(0, 7)));
  app.querySelectorAll("[data-mes]").forEach((b) => (b.onclick = () => ir(b.dataset.mes)));
  app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { F.categoria = F.categoria === b.dataset.cat ? "" : b.dataset.cat; telaDespesas(); }));
  app.querySelector("#dp-cat").onchange = (e) => { F.categoria = e.target.value; telaDespesas(); };
  app.querySelector("#dp-status").onchange = (e) => { F.status = e.target.value; telaDespesas(); };
  let tBusca;
  app.querySelector("#dp-busca").oninput = (e) => { clearTimeout(tBusca); tBusca = setTimeout(() => { F.q = e.target.value; telaDespesas().then(() => { const i = app.querySelector("#dp-busca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 350); };
  app.querySelector("#dp-nova").onclick = () => dialogoDespesa({ data: F.mes === HOJE().slice(0, 7) ? HOJE() : ini }, telaDespesas);
  app.querySelector("#dp-rec").onclick = async () => {
    const r = await db.rpc("despesas_gerar_recorrentes", { p_mes: ini });
    if (r.error) return toast(r.error.message, true);
    toast(r.data ? `${r.data} despesa(s) recorrente(s) lançada(s) como "a pagar".` : "As recorrentes deste mês já estão lançadas.");
    telaDespesas();
  };
  const fr = app.querySelector("#dp-rapida");
  fr.addEventListener("submit", async (e) => {
    e.preventDefault();
    const valor = numBR(fr.elements.valor.value);
    if (!fr.elements.descricao.value.trim() || !valor) return toast("Informe a descrição e o valor.", true);
    const r = await db.from("despesas").insert({ descricao: fr.elements.descricao.value.trim(), valor, categoria: fr.elements.categoria.value, data: fr.elements.data.value || HOJE(), pago: true });
    if (r.error) return toast(r.error.message, true);
    toast("Despesa lançada."); S.despUltCat = fr.elements.categoria.value;
    if ((fr.elements.data.value || HOJE()).slice(0, 7) !== F.mes) F.mes = (fr.elements.data.value || HOJE()).slice(0, 7);
    await telaDespesas(); app.querySelector("#dp-rapida [name=descricao]")?.focus();
  });
  if (S.despUltCat) fr.elements.categoria.value = S.despUltCat;
  // sugere a categoria pelo que foi digitado
  fr.elements.descricao.addEventListener("input", () => { const c = categoriaSugerida(fr.elements.descricao.value); if (c) fr.elements.categoria.value = c; });
  const achar = (id) => todas.find((x) => x.id === id) || aReembolsar.find((x) => x.id === id);
  app.querySelectorAll("[data-dp-pagar]").forEach((b) => (b.onclick = async () => {
    const r = await db.from("despesas").update({ pago: true }).eq("id", b.dataset.dpPagar); if (r.error) return toast(r.error.message, true); toast("Marcada como paga."); telaDespesas();
  }));
  app.querySelectorAll("[data-dp-reemb]").forEach((b) => (b.onclick = async () => {
    const r = await db.from("despesas").update({ reembolsado: true }).eq("id", b.dataset.dpReemb); if (r.error) return toast(r.error.message, true); toast("Marcada como reembolsada."); telaDespesas();
  }));
  app.querySelectorAll("[data-dp-editar]").forEach((b) => (b.onclick = () => dialogoDespesa(achar(b.dataset.dpEditar), telaDespesas)));
  app.querySelectorAll("[data-dp-dup]").forEach((b) => (b.onclick = async () => {
    const d = achar(b.dataset.dpDup);
    const prox = mesSomar(d.data.slice(0, 7), 1);
    const dia = Math.min(Number(d.data.slice(8)), Number(fimMes(prox).slice(8)));
    const { id, criado_em, atualizado_em, criado_por, recorrente, origem_id, ...resto } = d;
    const r = await db.from("despesas").insert({ ...resto, data: `${prox}-${String(dia).padStart(2, "0")}`, pago: false, reembolsado: false, comprovante_url: null });
    if (r.error) return toast(r.error.message, true);
    toast(`Lançada em ${mesRotulo(prox).toLowerCase()} como "a pagar".`);
  }));
  app.querySelector("#dp-xlsx").onclick = async () => {
    try { await carregarXLSX(); } catch { return toast("Não consegui carregar o gerador de planilhas.", true); }
    const linhas = [["Despesas · " + mesRotulo(F.mes)], [], ["Data", "Descrição", "Categoria", "Fornecedor", "Forma", "Situação", "Cliente", "Valor"]];
    todas.slice().sort((a, b) => a.data.localeCompare(b.data)).forEach((d) => linhas.push([dBR(d.data), d.descricao, d.categoria, d.fornecedor || "", d.forma || "", d.pago ? "paga" : "a pagar", S.cli[d.cliente_id]?.nome || "", Number(d.valor)]));
    linhas.push([], ["", "", "", "", "", "", "Total", totalMes], ["", "", "", "", "", "", "Pagas", soma(pagas)], ["", "", "", "", "", "", "A pagar", soma(abertas)], [], ["Por categoria"], ...cats.map(([c, v]) => [c, "", "", "", "", "", "", v]));
    const ws = XLSX.utils.aoa_to_sheet(linhas);
    ws["!cols"] = [{ wch: 11 }, { wch: 34 }, { wch: 24 }, { wch: 18 }, { wch: 16 }, { wch: 10 }, { wch: 24 }, { wch: 12 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Despesas");
    XLSX.writeFile(wb, "despesas-" + F.mes + ".xlsx");
  };
}

function categoriaSugerida(t) {
  const s = norm(t);
  const regras = [[/aluguel|locacao/, "Aluguel"], [/luz|energia|celesc|agua|casan|saneamento/, "Energia e água"], [/internet|telefone|celular|vivo|claro|tim\b|oi\b|fibra/, "Internet e telefone"],
    [/astrea|sistema|assinatura|software|google|microsoft|adobe|supabase|dominio|locaweb|resend|claude|chatgpt/, "Sistemas e assinaturas"],
    [/custas|guia|grj|drj|preparo|taxa judiciaria|distribuicao/, "Custas processuais"], [/pericia|perito|assistente tecnico|laudo/, "Perícias e assistentes técnicos"],
    [/cartorio|certidao|registro|matricula|reconhecimento de firma|autentica/, "Cartório e certidões"], [/combustivel|gasolina|diesel|posto/, "Combustível"],
    [/pedagio|viagem|diaria|hotel|onibus|uber|estacionamento|diligencia/, "Diligências e deslocamento"], [/correio|sedex|ar\b|carta registrada/, "Correios"],
    [/papel|toner|impressora|caneta|material/, "Material de escritório"], [/contador|contabil/, "Contador"], [/oab|anuidade|caasc/, "OAB e anuidades"],
    [/imposto|iss|irpf|das\b|simples|iptu|taxa/, "Impostos e taxas"], [/marketing|anuncio|instagram|impulsion|site/, "Marketing e site"],
    [/salario|estagiari|funcionari|secretari|inss patronal|fgts/, "Pessoal"], [/manutencao|conserto|reparo|limpeza/, "Manutenção"]];
  for (const [re, c] of regras) if (re.test(s)) return c;
  return "";
}

      reembolsado: f.elements.reembolsado ? f.elements.reembolsado.checked : false, comprovante_url: val(f, "comprovante_url") || null, observacoes: val(f, "observacoes") || null };

// ================= PUBLICAÇÕES (DJEN, pela OAB) =================
async function telaPublicacoes() {
  const filtro = S.filtroPub || "nao-lidas";
  app.innerHTML = '<div class="carregando">Carregando publicações...</div>';
  let q = db.from("publicacoes").select("*").order("data_disp", { ascending: false }).order("id", { ascending: false }).limit(300);
  if (filtro === "nao-lidas") q = q.eq("lida", false);
  const [r, req] = await Promise.all([q, db.from("djen_requisicoes").select("*").order("criado_em", { ascending: false }).limit(12)]);
  if (r.error) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc(r.error.message)}. Confira se o script 07 (publicações) foi executado no Supabase.</div></div>`);
  let lista = r.data;
  // Segurança extra: se alguma publicação ainda vier com acentos em código HTML (&ccedil;), converte na tela
  const decHTML = (t) => { if (!t || !/&[#A-Za-z0-9]+;/.test(t)) return t; const el = document.createElement("textarea"); el.innerHTML = t; return el.value; };
  lista.forEach((p) => { p.texto = decHTML(p.texto); p.orgao = decHTML(p.orgao); p.tipo = decHTML(p.tipo); });
  if (filtro === "sem-processo") lista = lista.filter((p) => !p.processo_id);
  const ult = (req.data || [])[0];
  const erros = (req.data || []).filter((x) => x.processado && x.status && x.status !== 200);
  const statusTxt = !ult ? "Nenhuma consulta feita ainda."
    : `Última consulta: ${dataBR(ult.criado_em)} ${horaBR(ult.criado_em)}${ult.processado ? (ult.status === 200 ? ` · ok (${ult.itens ?? 0} itens)` : ` · falhou (${ult.status || "sem resposta"})`) : " · aguardando resposta"}`;
  const procPorNum = {};
  S.processos.forEach((p) => { const k = String(p.numero || "").replace(/\D/g, ""); if (k) (procPorNum[k] ||= []).push(p); });
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra"><div><h1>Publicações</h1><p class="mudo peq">Capturadas automaticamente no Diário de Justiça Eletrônico Nacional (DJEN) pelas OABs 77.242/SC, 136.810/PR e 42.994/SC, de hora em hora, das 6h às 20h.</p>
      <p class="peq ${erros.length ? "" : "mudo"}" style="${erros.length ? "color:var(--err)" : ""}">${esc(statusTxt)}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" id="buscar30">Buscar últimos 30 dias</button><button class="btn btn-primario" id="buscar">Buscar agora</button></div></div>
    <div class="barra"><select id="f-pub" style="max-width:280px" aria-label="Filtro">
      <option value="nao-lidas">Não lidas</option><option value="todas">Todas (últimas 300)</option><option value="sem-processo">De processos não cadastrados</option></select>
      ${lista.some((p) => !p.lida) ? '<button class="btn btn-sec btn-peq" id="ler-todas">Marcar todas como lidas</button>' : ""}</div>
    ${lista.length ? `<div class="lista">${lista.map((p) => {
      const procs = procPorNum[p.numero_processo] || [];
      const c = procs[0] && S.cli[procs[0].cliente_id];
      const longo = (p.texto || "").length > 420;
      return `<div class="item" style="align-items:flex-start"><div class="principal" style="flex:1">
        <div><span class="peq mudo">${p.data_disp ? dBR(p.data_disp) : ""}${p.tribunal ? " · " + esc(p.tribunal) : ""}${p.orgao ? " · " + esc(p.orgao) : ""}</span> ${p.lida ? "" : '<span class="tag tag-prazo">nova</span>'}</div>
        <div><b>${esc(p.tipo || "Comunicação")}</b> · processo ${esc(p.numero_mascara || p.numero_processo || "sem número")}</div>
        <div class="sec">${c ? procs.map((pp) => `<a href="#cliente/${pp.cliente_id}">${esc(S.cli[pp.cliente_id]?.nome || "")}</a> · ${esc(pp.titulo)}`).join("<br>") : '<span style="color:var(--warn)">processo não cadastrado no painel</span>'}</div>
        <div class="pub-texto${longo ? " recolhido" : ""}" data-txt="${p.id}">${esc(p.texto || "")}</div>
        ${longo ? `<button class="pub-alternar" data-vermais="${p.id}" aria-expanded="false"><span>Ver texto completo</span> <i aria-hidden="true">▾</i></button>` : ""}
        ${p.link || c?.drive_url ? `<div class="peq">${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">Abrir o documento</a>` : ""}${p.link && c?.drive_url ? " · " : ""}${c?.drive_url ? `<a href="${esc(c.drive_url)}" target="_blank" rel="noopener">Pasta do cliente no Drive</a>` : ""}</div>` : ""}
      </div><div class="dir" style="flex-direction:column;align-items:stretch">
        ${c ? `<button class="btn btn-sec btn-peq" data-mostrar="${p.id}">Mostrar ao cliente</button>` : `<button class="btn btn-primario btn-peq" data-cadastrar="${p.id}">Cadastrar processo</button>`}
        ${p.lida ? "" : `<button class="btn btn-sec btn-peq" data-lida="${p.id}">Marcar como lida</button>`}
      </div></div>`;
    }).join("")}</div>` : `<div class="vazio">${filtro === "nao-lidas" ? "Nenhuma publicação nova." : "Nenhuma publicação encontrada."} Use "Buscar agora" para consultar o DJEN.</div>`}
  </div>`;
  const sel = app.querySelector("#f-pub"); sel.value = filtro;
  sel.onchange = () => { S.filtroPub = sel.value; telaPublicacoes(); };
  const buscar = async (dias) => {
    const r1 = await db.rpc("djen_buscar_agora", { dias });
    if (r1.error) return toast(r1.error.message, true);
    toast("Consultando o DJEN... aguarde alguns segundos.");
    await new Promise((ok) => setTimeout(ok, 15000));
    const r2 = await db.rpc("djen_processar_agora");
    if (r2.error) return toast(r2.error.message, true);
    toast(r2.data ? `${r2.data} publicação(ões) nova(s).` : "Nenhuma publicação nova nesta consulta.");
    telaPublicacoes();
  };
  app.querySelector("#buscar").onclick = (e) => { e.target.disabled = true; buscar(3); };
  app.querySelector("#buscar30").onclick = (e) => { e.target.disabled = true; buscar(30); };
  app.querySelector("#ler-todas")?.addEventListener("click", async () => {
    const ids = lista.filter((p) => !p.lida).map((p) => p.id);
    const r3 = await db.from("publicacoes").update({ lida: true }).in("id", ids);
    if (r3.error) toast(r3.error.message, true); telaPublicacoes();
  });
  app.querySelectorAll("[data-vermais]").forEach((b) => (b.onclick = () => {
    const caixa = app.querySelector(`[data-txt="${b.dataset.vermais}"]`);
    const abrir = caixa.classList.contains("recolhido");
    caixa.classList.toggle("recolhido", !abrir);
    b.setAttribute("aria-expanded", String(abrir));
    b.querySelector("span").textContent = abrir ? "Recolher texto" : "Ver texto completo";
    // ao recolher um texto longo, volta a tela para o início da publicação
    if (!abrir) { const item = b.closest(".item"); if (item && item.getBoundingClientRect().top < 0) item.scrollIntoView({ block: "start", behavior: "smooth" }); }
  }));
  app.querySelectorAll("[data-lida]").forEach((b) => (b.onclick = async () => {
    await db.from("publicacoes").update({ lida: true }).eq("id", Number(b.dataset.lida)); telaPublicacoes();
  }));
  app.querySelectorAll("[data-mostrar]").forEach((b) => (b.onclick = () => {
    const p = lista.find((x) => String(x.id) === b.dataset.mostrar);
    const procs = procPorNum[p.numero_processo] || [];
    dialogoEvento({ evento: { tipo: "andamento", titulo: p.tipo || "Publicação no processo", descricao: "", visivel_cliente: true, notificar: true, processo_id: procs[0].id },
      escolherProcesso: false, depois: async () => { await db.from("publicacoes").update({ lida: true }).eq("id", p.id); telaPublicacoes(); } });
    toast("Escreva ao cliente, em linguagem simples, o que a publicação significa.");
  }));
  app.querySelectorAll("[data-cadastrar]").forEach((b) => (b.onclick = () => dialogoCadastrarPub(lista.find((x) => String(x.id) === b.dataset.cadastrar))));
}

function dialogoCadastrarPub(pub) {
  const nomes = S.clientes.map((c) => c.nome).sort((a, b) => a.localeCompare(b, "pt-BR"));
  abrir(`
  <form novalidate><h2>Cadastrar processo</h2>
    <p class="peq mudo" style="margin:-8px 0 14px">Processo ${esc(pub.numero_mascara || pub.numero_processo)}${pub.orgao ? " · " + esc(pub.orgao) : ""}</p>
    <div class="campo"><label for="cp-cli">Cliente</label><input id="cp-cli" name="cliente" type="search" list="cp-lista" required autocomplete="off" placeholder="Digite o nome; se não existir, será criado">
      <datalist id="cp-lista">${nomes.map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist></div>
    <div class="campo"><label for="cp-tit">Título do processo</label><input id="cp-tit" name="titulo" type="text" required placeholder="Ex.: Ação de cobrança"></div>
    <div class="linha2"><div class="campo"><label for="cp-juizo">Juízo</label><input id="cp-juizo" name="juizo" type="text" value="${esc(pub.orgao || "")}"></div>
      <div class="campo"><label for="cp-parte">Parte contrária</label><input id="cp-parte" name="parte" type="text"></div></div>
    <div class="dlg-botoes"><div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Cadastrar</button></div></div>
  </form>`, async (f) => {
    const nome = val(f, "cliente"), titulo = val(f, "titulo");
    if (!nome || !titulo) return toast("Informe o cliente e o título.", true);
    let c = S.clientes.find((x) => norm(x.nome) === norm(nome));
    if (!c) {
      const rc = await db.from("clientes").insert({ nome, origem: "djen" }).select().single();
      if (rc.error) return toast(rc.error.message, true);
      c = rc.data;
    }
    const numero = pub.numero_mascara || pub.numero_processo;
    const rp = await db.from("processos").insert({ cliente_id: c.id, titulo, numero, juizo: val(f, "juizo") || null, parte_contraria: val(f, "parte") || null }).select().single();
    if (rp.error) return toast(rp.error.message, true);
    await db.from("eventos").insert({ processo_id: rp.data.id, tipo: "andamento", titulo: "Publicação no DJEN: " + (pub.tipo || "Comunicação"),
      descricao: (pub.texto || "").slice(0, 4000), data_hora: isoDeBrasilia(pub.data_disp || HOJE(), "12:00"), visivel_cliente: false, notificar: false });
    await db.from("publicacoes").update({ processo_id: rp.data.id }).eq("numero_processo", pub.numero_processo);
    dlg.close(); toast("Processo cadastrado."); await recarregarBase(); telaPublicacoes();
  });
}

// ================= HONORÁRIOS (visão geral) =================
async function telaHonorarios() {
  app.innerHTML = '<div class="carregando">Carregando...</div>';
  const [hon, par] = await Promise.all([db.from("honorarios").select("*"), db.from("parcelas").select("*").order("vencimento", { ascending: true })]);
  if (hon.error || par.error) return toast((hon.error || par.error).message, true);
  const hoje = HOJE(), honPor = Object.fromEntries(hon.data.map((h) => [h.id, h]));
  const abertas = par.data.filter((p) => !p.pago_em);
  const vencidas = abertas.filter((p) => p.vencimento < hoje);
  const aVencer = abertas.filter((p) => p.vencimento >= hoje);
  const iniMes = hoje.slice(0, 8) + "01";
  const pagasMes = par.data.filter((p) => p.pago_em && p.pago_em >= iniMes).sort((a, b) => (a.pago_em < b.pago_em ? 1 : -1));
  const soma = (l) => l.reduce((s, p) => s + Number(p.valor), 0);
  const exito = hon.data.filter((h) => !h.encerrado && (h.modalidade === "previdenciario" || h.modalidade === "exito" || h.modalidade === "misto") && h.percentual);
  const linha = (p, acao = true) => {
    const h = honPor[p.honorario_id], c = h && S.cli[h.cliente_id];
    return `<div class="item"><div class="principal"><div><b>${moeda(p.valor)}</b> <span class="peq" style="${!p.pago_em && p.vencimento < hoje ? "color:var(--err)" : "color:var(--muted)"}">${p.pago_em ? "pago em " + dBR(p.pago_em) : "vence " + dBR(p.vencimento)}</span></div>
      <div class="sec"><a href="#cliente/${c?.id}">${esc(c?.nome || "")}</a> · ${esc(h?.descricao || "")}</div></div>
      ${acao ? `<div class="dir">${botaoWhats(c?.whatsapp, msgCobranca(c || {}, p), "Cobrar")}<button class="btn btn-sec btn-peq" data-pagar="${p.id}">Marcar pago</button></div>` : ""}</div>`;
  };
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <h1 style="margin-bottom:14px">Honorários</h1>
    <div class="cards">
      <div class="card-num ${vencidas.length ? "alerta" : ""}"><div class="n">${moeda(soma(vencidas))}</div><div class="l">vencidos (${vencidas.length})</div></div>
      <div class="card-num"><div class="n">${moeda(soma(aVencer))}</div><div class="l">a vencer (${aVencer.length})</div></div>
      <div class="card-num"><div class="n">${moeda(soma(pagasMes))}</div><div class="l">recebido neste mês</div></div>
      <div class="card-num"><div class="n">${exito.length}</div><div class="l">contratos de êxito em andamento</div></div>
    </div>
    <div class="colunas">
      <div>
        <div class="bloco"><h2 style="margin-bottom:10px">Vencidos</h2>${vencidas.length ? `<div class="lista">${vencidas.map((p) => linha(p)).join("")}</div>` : `<div class="vazio">Nenhuma parcela vencida.</div>`}</div>
        <div class="bloco"><h2 style="margin-bottom:10px">A vencer</h2>${aVencer.length ? `<div class="lista">${aVencer.slice(0, 60).map((p) => linha(p)).join("")}</div>` : `<div class="vazio">Nenhuma parcela a vencer.</div>`}</div>

function padraoNum(d, p) { let out = "", i = 0; for (const ch of p) { if (i >= d.length) break; if (ch === "0") out += d[i++]; else out += ch; } return out; }
const MASCARA = {
  cpf: (d) => padraoNum(d.slice(0, 11), "000.000.000-00"),
  cnpj: (d) => padraoNum(d.slice(0, 14), "00.000.000/0000-00"),
  cep: (d) => padraoNum(d.slice(0, 8), "00000-000"),
  cnj: (d) => padraoNum(d.slice(0, 20), "0000000-00.0000.0.00.0000"),
  fone: (d) => { if (d.length > 11 && d.startsWith("55")) d = d.slice(2); d = d.slice(0, 11); return d.length > 10 ? padraoNum(d, "(00) 0 0000-0000") : padraoNum(d, "(00) 0000-0000"); },
};
function formatarMoedaCampo(el) { const n = numBR(el.value); el.value = n ? n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : el.value.trim() ? "" : ""; }
function avisoCampo(el, html, tipo) {
  const box = el.closest(".campo") || el.parentElement;
  let s = box.querySelector(".valida");
  if (!html) { s?.remove(); el.classList.remove("campo-ok", "campo-erro"); return; }
  if (!s) { s = document.createElement("span"); s.className = "valida"; box.appendChild(s); }
  s.className = "valida " + tipo; s.innerHTML = html;
  el.classList.toggle("campo-ok", tipo === "ok"); el.classList.toggle("campo-erro", tipo === "erro");
}
function validarCampo(el) {
  const m = el.dataset.mask, d = el.value.replace(/\D/g, "");
  if (m === "cpf") {
    if (d.length < 11) return avisoCampo(el, "");
    if (!cpfValido(el.value)) return avisoCampo(el, "CPF inválido. Confira os números.", "erro");
    const outro = S.clientes.find((c) => c.id !== el.dataset.cliente && String(c.cpf || "").replace(/\D/g, "") === d);
    return avisoCampo(el, outro ? `Já cadastrado: <a href="#cliente/${outro.id}" data-fechar>${esc(outro.nome)}</a>` : "CPF válido ✓", outro ? "erro" : "ok");
  }
  if (m === "fone") {
    if (!d) return avisoCampo(el, "");
    if (d.length < 10) return avisoCampo(el, "Faltam números (DDD + telefone).", "erro");
    return avisoCampo(el, el.name === "whatsapp" ? `<a href="${linkWhats(normalizaWhats(d), "")}" target="_blank" rel="noopener">Testar no WhatsApp</a>` : "", "ok");
  }
  if (m === "cnj") {
    if (!d) return avisoCampo(el, "");
    return d.length === 20 ? avisoCampo(el, `Número completo ✓${NOME_TRIB(d) ? " · " + NOME_TRIB(d) : ""}`, "ok") : avisoCampo(el, "O número CNJ tem 20 dígitos.", "erro");
  }
  if (m === "drive") {
    const v = el.value.trim();
    if (!v) return avisoCampo(el, "");
    if (!/^https:\/\/\S+$/i.test(v)) return avisoCampo(el, "O link deve começar com https://", "erro");
    return avisoCampo(el, `<a href="${esc(v)}" target="_blank" rel="noopener">Abrir a pasta</a>${/drive\.google\.com|docs\.google\.com/.test(v) ? "" : " · não parece um link do Google Drive"}`, /drive\.google\.com|docs\.google\.com/.test(v) ? "ok" : "erro");
  }
  if (m === "email") {
    const v = el.value.trim();
    if (!v) return avisoCampo(el, "");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return avisoCampo(el, "E-mail incompleto.", "erro");
    const outro = S.clientes.find((c) => c.id !== el.dataset.cliente && String(c.email || "").toLowerCase() === v.toLowerCase());
    return avisoCampo(el, outro ? `Já usado por <a href="#cliente/${outro.id}" data-fechar>${esc(outro.nome)}</a>` : "", outro ? "erro" : "ok");
  }
}
function aplicarMascara(el) {
  const m = el.dataset.mask;
  if (MASCARA[m]) { const d = el.value.replace(/\D/g, ""); if (d || el.value) el.value = MASCARA[m](d); }
}
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.mask) return;
  if (MASCARA[el.dataset.mask]) {
    const fim = el.selectionStart === el.value.length;
    aplicarMascara(el);
    if (fim) el.setSelectionRange(el.value.length, el.value.length);
  } else if (el.dataset.mask === "moeda") {
    el.value = el.value.replace(/[^\d.,]/g, "");
  }
  validarCampo(el);
});
document.addEventListener("focusout", (e) => { const el = e.target; if (el.dataset && el.dataset.mask === "moeda" && el.value) formatarMoedaCampo(el); });
function prepararCampos(raiz) {
  raiz.querySelectorAll("[data-mask]").forEach((el) => { if (el.value) { aplicarMascara(el); if (el.dataset.mask === "moeda") formatarMoedaCampo(el); validarCampo(el); } });
}

function abrir(html, aoEnviar, grande = false) {
  dlg.className = grande ? "grande" : "";
  dlg.innerHTML = html;

}
const val = (f, n) => (f.elements[n] ? String(f.elements[n].value || "").trim() : "");
const inp = (nome, rot, v, extra = "", cls = "c3") =>
  `<div class="campo ${cls}"><label for="f-${nome}">${rot}</label><input id="f-${nome}" name="${nome}" type="text" value="${esc(v)}" ${extra}></div>`;
const selEC = (nome, v) => `<select id="f-${nome}" name="${nome}"><option value="">Não informado</option>${Object.entries(ESTADOS_CIVIS).map(([k, t]) => `<option value="${k}" ${v === k ? "selected" : ""}>${t[0].replace(/o$/, "o(a)").replace("em união estável", "União estável")}</option>`).join("")}</select>`;
const SEXO = (nome, v) => `<select id="f-${nome}" name="${nome}"><option value="m" ${v !== "f" ? "selected" : ""}>Masculino</option><option value="f" ${v === "f" ? "selected" : ""}>Feminino</option></select>`;
const UFS = "AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");

function mascaraCPF(v) { const d = String(v || "").replace(/\D/g, ""); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : String(v || "").trim(); }
function mascaraCNPJ(v) { const d = String(v || "").replace(/\D/g, ""); return d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5") : String(v || "").trim(); }
function mascaraCEP(v) { const d = String(v || "").replace(/\D/g, ""); return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, "$1-$2") : String(v || "").trim(); }
function cpfValido(v) {
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  const calc = (n) => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return calc(9) === +d[9] && calc(10) === +d[10];
}
