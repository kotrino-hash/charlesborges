<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Escritório | Charles Borges Advocacia</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#1F2F42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script src="pizzip.min.js"></script>
<script src="docxtemplater.min.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="marca" href="#resumo"><img src="emblema.png" alt=""><span><b>CHARLES BORGES</b><small>PAINEL DO ESCRITÓRIO</small></span></a>
    <div class="acoes"><span id="quem" class="peq" style="color:#C9CFD8"></span><button class="link-topo" id="sair" hidden>Sair</button></div>
  </div>
</header>
<nav class="abas" id="abas" hidden aria-label="Seções">
  <div class="wrap" role="tablist">
    <button class="aba" role="tab" data-rota="resumo">Resumo</button>
    <button class="aba" role="tab" data-rota="agenda">Agenda</button>
    <button class="aba" role="tab" data-rota="clientes">Clientes</button>
    <button class="aba" role="tab" data-rota="fila">Fila</button>
    <button class="aba" role="tab" data-rota="movimentacoes">Movimentações</button>
    <button class="aba" role="tab" data-rota="publicacoes">Publicações</button>
    <button class="aba" role="tab" data-rota="calculos">Cálculos</button>
    <button class="aba" role="tab" data-rota="honorarios">Honorários</button>
    <button class="aba" role="tab" data-rota="despesas">Despesas</button>
    <button class="aba" role="tab" data-rota="envios">Avisos</button>
  </div>
</nav>
<main id="app"><div class="carregando">Carregando...</div></main>
<dialog id="dlg"></dialog>

<script type="module">
import {
  db, configurado, esc, primeiroNome, NOME_TIPO, dataBR, horaBR, dataLonga, partesData, isoDeBrasilia, chaveDia,
  normalizaWhats, mostraWhats, linkWhats, PORTAL_URL, montarLogin, toast
} from "./portal-comum.js";
import { MODELOS, ESTADOS_CIVIS, montarDados, gerarDocx, moeda, dividirParcelas, reaisExtenso, inteiroExtenso } from "./documentos.js";
import { prepararIndices, calcularPrevidenciario, calcularAtualizacao, REGIMES, JUROS, NOMES_INDICE, rotuloMes, smEm, mesDe } from "./calculos.js";

const app = document.getElementById("app");
const dlg = document.getElementById("dlg");
const abas = document.getElementById("abas");
const PAINEL_URL = PORTAL_URL.replace("cliente.html", "painel.html");
const ICON_WHATS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
const HOJE = () => partesData(new Date().toISOString()).data;
const somaDias = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dBR = (d) => (d ? d.split("-").reverse().join("/") : "");
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

const CHECKLISTS = {
  "Previdenciário (incapacidade)": ["RG e CPF", "Comprovante de residência atualizado", "Carteira de trabalho (CTPS)", "Extrato CNIS", "Comunicado de indeferimento ou cessação do INSS", "Laudos, exames e atestados médicos", "Receitas de medicamentos"],
  "Previdenciário rural (segurado especial)": ["RG e CPF", "Comprovante de residência atualizado", "Notas fiscais de produtor rural", "Inscrição de produtor rural (bloco)", "Certidão de casamento ou de nascimento dos filhos", "Documentos do imóvel rural (matrícula, ITR ou CCIR)", "Autodeclaração do segurado especial", "Comunicado de indeferimento do INSS", "Extrato CNIS"],
  "Bancário / revisional": ["RG e CPF", "Comprovante de residência atualizado", "Contrato bancário", "Comprovantes de pagamento das parcelas", "Extratos bancários do período", "Comprovante de renda"],
  "Família": ["RG e CPF", "Comprovante de residência atualizado", "Certidão de casamento ou nascimento", "Certidões de nascimento dos filhos", "Comprovante de renda", "Relação e documentos dos bens"],
  "Consumidor": ["RG e CPF", "Comprovante de residência atualizado", "Nota fiscal ou contrato", "Comprovantes de pagamento", "Protocolos de atendimento", "Fotos, vídeos ou prints"],
  "Trabalhista": ["RG e CPF", "Comprovante de residência atualizado", "Carteira de trabalho (CTPS)", "Contracheques", "Termo de rescisão", "Extrato do FGTS", "Nomes e contatos de testemunhas"],
  "Criminal": ["RG e CPF", "Comprovante de residência atualizado", "Boletim de ocorrência", "Intimações e decisões recebidas", "Comprovante de trabalho"],
  "Inventário / arrolamento": ["Certidão de óbito", "RG, CPF e certidões dos herdeiros", "Certidão de casamento do falecido", "Matrículas e documentos dos bens", "Certidões negativas (municipal, estadual e federal)", "Extratos bancários do falecido"],
};

const AREAS = {
  previdenciario: ["Previdenciário", "#E3ECF6", "#1F4A7A"], civel: ["Cível", "#EEEEF0", "#4A4F58"], familia: ["Família", "#F6E9EF", "#7A2F55"],
  sucessoes: ["Sucessões", "#F1E9DF", "#6A4F37"], criminal: ["Criminal", "#F8E6E3", "#8A2E22"], trabalhista: ["Trabalhista", "#FBF1DC", "#7A5200"],
  bancario: ["Bancário", "#E6F0EE", "#245B50"], consumidor: ["Consumidor", "#EAF3E4", "#3D6224"], imobiliario: ["Imobiliário", "#EDE8F5", "#4E3A7A"],
  administrativo: ["Administrativo", "#E4EEF3", "#285A6E"], empresarial: ["Empresarial", "#F0ECE4", "#5A4A30"],
};
const tagArea = (a) => (a && AREAS[a] ? `<span class="tag" style="background:${AREAS[a][1]};color:${AREAS[a][2]}">${AREAS[a][0]}</span>` : "");
const areasDoCliente = (id) => [...new Set(S.processos.filter((p) => p.cliente_id === id && !p.arquivado && p.area).map((p) => p.area))];

const S = { advogado: null, clientes: [], processos: [], cli: {}, proc: {}, iniciado: false };

// ================= início =================
async function iniciar() {
  if (!configurado) return montarLogin(app, { titulo: "Painel do Escritório", sub: "", destino: PAINEL_URL });
  const { data: { session } } = await db.auth.getSession();
  if (session) await entrar(session); else mostrarLogin();
  db.auth.onAuthStateChange((ev, s) => {
    if (ev === "SIGNED_IN" && s && !S.iniciado) entrar(s);
    if (ev === "SIGNED_OUT") location.reload();
  });
}
function mostrarLogin() { montarLogin(app, { titulo: "Painel do Escritório", sub: "Acesso restrito aos advogados do escritório.", destino: PAINEL_URL }); }
document.getElementById("sair").addEventListener("click", () => db.auth.signOut());

async function entrar(session) {
  S.iniciado = true;
  if (location.hash.includes("access_token")) history.replaceState(null, "", location.pathname + "#resumo");
  app.innerHTML = '<div class="carregando">Carregando...</div>';
  const { data: adv } = await db.from("advogados").select("*");
  const eu = (adv || []).find((a) => a.email.toLowerCase() === session.user.email.toLowerCase());
  if (!eu) {
    app.innerHTML = `<div class="login"><div class="cartao"><h1>Acesso restrito</h1><p class="sub" style="margin-top:10px">O e-mail <b>${esc(session.user.email)}</b> não está autorizado a usar o painel.</p><button class="btn btn-sec" id="x">Sair</button></div></div>`;
    app.querySelector("#x").onclick = () => db.auth.signOut();
    return;
  }
  S.advogado = eu; S.advogadosLista = adv || [];
  document.getElementById("quem").textContent = primeiroNome(eu.nome);
  document.getElementById("sair").hidden = false;
  abas.hidden = false;
  await recarregarBase();
  window.addEventListener("hashchange", rotear);
  rotear();
}

async function recarregarBase() {
  const [c, p] = await Promise.all([
    db.from("clientes").select("*").order("nome", { ascending: true }),
    db.from("processos").select("*").order("criado_em", { ascending: true }),
  ]);
  if (c.error || p.error) return toast("Erro ao carregar dados: " + (c.error || p.error).message, true);
  S.clientes = c.data; S.processos = p.data;
  S.cli = Object.fromEntries(S.clientes.map((x) => [x.id, x]));
  S.proc = Object.fromEntries(S.processos.map((x) => [x.id, x]));
}

abas.addEventListener("click", (e) => { const r = e.target.closest("[data-rota]"); if (r) location.hash = r.dataset.rota; });

function rotear() {
  const [rota, id] = (location.hash.replace("#", "") || "resumo").split("/");
  const aba = rota === "cliente" ? "clientes" : rota;
  abas.querySelectorAll(".aba").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.rota === aba)));
  window.scrollTo(0, 0);
  if (rota === "agenda") return telaAgenda();
  if (rota === "clientes") return telaClientes();
  if (rota === "cliente" && id) return telaCliente(id);
  if (rota === "honorarios") return telaHonorarios();
  if (rota === "despesas") return telaDespesas();
  if (rota === "publicacoes") return telaPublicacoes();
  if (rota === "calculos") return telaCalculos();
  // Jurisprudência desativada (busca do TJSC exige CAPTCHA). Para reativar: descomente e devolva a aba no menu.
  // if (rota === "jurisprudencia") return telaJurisprudencia();
  if (rota === "fila") return telaFila();
  if (rota === "movimentacoes") return telaMovimentacoes();
  if (rota === "envios") return telaEnvios();
  return telaResumo();
}

// ================= auxiliares =================
function pendenciasFicha(c) {
  const f = [];
  if (!c.email) f.push("e-mail");
  if (c.tipo_pessoa === "pj") { if (!c.cnpj) f.push("CNPJ"); }
  else { if (!c.cpf) f.push("CPF"); if (!c.estado_civil && !c.rep_nome) f.push("estado civil"); }
  if (!c.logradouro || !c.cidade || !c.uf) f.push("endereço");
  return f;
}
function msgEvento(ev) {
  const p = S.proc[ev.processo_id], c = p && S.cli[p.cliente_id];
  const partes = [`Olá, ${primeiroNome(c?.nome)}! Aqui é do escritório Charles Borges Advocacia.`];
  if (ev.tipo === "andamento") partes.push(`Há uma atualização no seu processo ${p.titulo}: ${ev.titulo}.`);
  else {
    const verbo = ev.tipo === "reuniao" ? "agendada" : ev.tipo === "prazo" ? "registrado" : "marcada";
    partes.push(`Foi ${verbo} ${ev.tipo === "prazo" ? "um" : "uma"} ${NOME_TIPO[ev.tipo].toLowerCase()} no seu processo ${p.titulo}: ${ev.titulo}.`);
    partes.push(`Data: ${dataLonga(ev.data_hora)}, às ${horaBR(ev.data_hora)}.`);
    if (ev.local) partes.push(`Local: ${ev.local}.`);
    if (ev.link) partes.push(`Acesso: ${ev.link}`);
  }
  if (ev.descricao) partes.push(ev.descricao);
  partes.push(`Você também pode acompanhar pela área do cliente: ${PORTAL_URL}`);
  return partes.join("\n\n");
}
function msgAcesso(c) {
  return `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia.\n\nAgora você pode acompanhar seus processos, audiências e perícias pela área do cliente:\n${PORTAL_URL}\n\nPara entrar, use o e-mail ${c.email}. Você vai receber um e-mail com o botão de acesso e um código. Não precisa de senha.\n\nQualquer dúvida, estou à disposição.`;
}
function msgDocs(c, itens) {
  return `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia.\n\nPara darmos andamento ao seu caso, precisamos dos seguintes documentos:\n\n${itens.map((i) => "• " + i).join("\n")}\n\nPode mandar foto ou PDF aqui mesmo pelo WhatsApp. Obrigado!`;
}
function msgCobranca(c, parc) {
  return `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia.\n\nPassando para lembrar da parcela de honorários no valor de ${moeda(parc.valor)}, com vencimento em ${dBR(parc.vencimento)}.\n\nSe já pagou, por favor desconsidere e nos envie o comprovante. Obrigado!`;
}
function botaoWhats(numero, texto, rotulo = "WhatsApp") {
  if (!numero) return "";
  return `<a class="btn btn-whats btn-peq" target="_blank" rel="noopener" href="${linkWhats(numero, texto)}">${ICON_WHATS} ${rotulo}</a>`;
}
function statusAviso(ev) {
  if (!ev.visivel_cliente) return `<span class="tag tag-oculto">interno</span>`;
  if (!ev.notificar) return `<span class="peq mudo">sem aviso por e-mail</span>`;
  const env = [ev.aviso_enviado_em && "aviso", ev.lembrete_7d_enviado_em && "7 dias", ev.lembrete_1d_enviado_em && "véspera"].filter(Boolean);
  return env.length ? `<span class="peq mudo">e-mail enviado: ${env.join(", ")}</span>` : `<span class="peq mudo">e-mail programado</span>`;
}
function itemEvento(e, comCliente = true) {
  const p = S.proc[e.processo_id], c = p && S.cli[p.cliente_id];
  return `<div class="item">
    <div class="principal">
      <div>${e.tipo !== "andamento" ? `<span class="hora">${dataBR(e.data_hora).slice(0, 5)} ${horaBR(e.data_hora)}</span>` : `<span class="peq mudo">${dataBR(e.criado_em)}</span> `}
        <span class="tag tag-${e.tipo}">${NOME_TIPO[e.tipo]}</span></div>
      <div><b>${esc(e.titulo)}</b></div>
      ${comCliente ? `<div class="sec"><a href="#cliente/${c?.id}">${esc(c?.nome || "")}</a> · ${esc(p?.titulo || "")}${e.local ? " · " + esc(e.local) : ""}</div>` : ""}
      <div>${statusAviso(e)}</div>
    </div>
    <div class="dir">
      ${e.visivel_cliente ? botaoWhats(c?.whatsapp, msgEvento(e)) : ""}
      <button class="btn btn-sec btn-peq" data-editar-ev="${e.id}">Editar</button>
    </div>
  </div>`;
}
function ligarEventos(raiz, lista, depois) {
  raiz.querySelectorAll("[data-editar-ev]").forEach((b) => (b.onclick = () => dialogoEvento({ evento: lista.find((x) => x.id === b.dataset.editarEv), depois })));
}

// ================= RESUMO =================
function saudacao() { const h = Number(new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", hourCycle: "h23" }).format(new Date())); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
async function telaResumo() {
  app.innerHTML = '<div class="carregando">Carregando resumo...</div>';
  const hoje = HOJE();
  const iniHoje = isoDeBrasilia(hoje, "00:00");
  const fim7 = isoDeBrasilia(somaDias(hoje, 7), "23:59");
  const [ev, hon, par, docs, pubs, fil, movn, ale] = await Promise.all([
    db.from("eventos").select("*").neq("tipo", "andamento").gte("data_hora", iniHoje).lte("data_hora", fim7).order("data_hora", { ascending: true }),
    db.from("honorarios").select("*"),
    db.from("parcelas").select("*").order("vencimento", { ascending: true }),
    db.from("documentos").select("*"),
    db.from("publicacoes").select("id").eq("lida", false),
    db.from("fila").select("id,prazo,prazo_ajuizar").neq("etapa", "ajuizado"),
    db.from("movimentos").select("processo_id").eq("lida", false).limit(5000),
    db.from("atendimento_alertas").select("*").is("resolvido_em", null).order("criado_em", { ascending: false }).limit(30),
  ]);
  const alertasAt = ale.error ? [] : ale.data;
  const naFila = fil.error ? [] : fil.data;
  const filaPrazo = naFila.filter((x) => (x.prazo && x.prazo <= somaDias(hoje, 15)) || (x.prazo_ajuizar && x.prazo_ajuizar <= somaDias(hoje, 2))).length;
  const naoLidas = pubs.error ? 0 : pubs.data.length;
  const erro = ev.error || hon.error || par.error || docs.error;
  if (erro) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc(erro.message)}</div></div>`);
  const honPor = Object.fromEntries(hon.data.map((h) => [h.id, h]));
  const abertas = par.data.filter((p) => !p.pago_em);
  const vencidas = abertas.filter((p) => p.vencimento < hoje);
  const proximas = abertas.filter((p) => p.vencimento >= hoje && p.vencimento <= somaDias(hoje, 15));
  const soma = (l) => l.reduce((s, p) => s + Number(p.valor), 0);
  const ativos = S.clientes.filter((c) => c.ativo);
  const incompletas = ativos.filter((c) => pendenciasFicha(c).length);
  const semEmail = ativos.filter((c) => !c.email);
  const docsPend = {};
  docs.data.filter((d) => !d.entregue).forEach((d) => (docsPend[d.cliente_id] = (docsPend[d.cliente_id] || 0) + 1));
  const prazos = ev.data.filter((e) => e.tipo === "prazo");
  const compromissos = ev.data.filter((e) => e.tipo !== "prazo");
  const iniMes = hoje.slice(0, 8) + "01";
  const recebidoMes = soma(par.data.filter((p) => p.pago_em && p.pago_em >= iniMes && p.pago_em <= hoje));
  const porArea = {};
  S.processos.filter((p) => !p.arquivado).forEach((p) => { const k = p.area || ""; porArea[k] ||= { proc: 0, cli: new Set() }; porArea[k].proc++; porArea[k].cli.add(p.cliente_id); });
  const linhasArea = Object.entries(porArea).sort((a, b) => b[1].proc - a[1].proc);

  const linhaParcela = (p) => {
    const h = honPor[p.honorario_id], c = h && S.cli[h.cliente_id];
    return `<div class="item"><div class="principal"><div><b>${moeda(p.valor)}</b> <span class="peq ${p.vencimento < hoje ? "" : "mudo"}" style="${p.vencimento < hoje ? "color:var(--err)" : ""}">vence ${dBR(p.vencimento)}</span></div>
      <div class="sec"><a href="#cliente/${c?.id}">${esc(c?.nome || "")}</a> · ${esc(h?.descricao || "")}</div></div>
      <div class="dir">${botaoWhats(c?.whatsapp, msgCobranca(c || {}, p), "Cobrar")}<button class="btn btn-sec btn-peq" data-pagar="${p.id}">Marcar pago</button></div></div>`;
  };

  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra"><div><h1>${saudacao()}, ${esc(primeiroNome(S.advogado.nome))}.</h1><p class="mudo peq">${esc(dataLonga(new Date().toISOString()))}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" id="r-cli">+ Novo cliente</button><button class="btn btn-primario" id="r-ev">+ Lançar evento</button></div></div>
    <div class="cards">
      <a class="card-num ${movn.data?.length ? "aviso" : ""}" href="#movimentacoes"><div class="n">${movn.error ? "-" : new Set(movn.data.map((m) => m.processo_id)).size}</div><div class="l">processos com movimentação nova no tribunal</div></a>
      <a class="card-num ${naoLidas ? "aviso" : ""}" href="#publicacoes"><div class="n">${naoLidas}</div><div class="l">publicações novas do DJEN</div></a>
      <a class="card-num ${filaPrazo ? "alerta" : ""}" href="#fila"><div class="n">${naFila.length}</div><div class="l">ações na fila de ajuizamento${filaPrazo ? ` (${filaPrazo} no limite ou atrasada${filaPrazo === 1 ? "" : "s"})` : ""}</div></a>
      <a class="card-num ${alertasAt.length ? "alerta" : ""}" href="#resumo" data-ir-alertas><div class="n">${alertasAt.length}</div><div class="l">pedidos do atendimento online</div></a>
      <a class="card-num" href="#agenda"><div class="n">${compromissos.length}</div><div class="l">audiências, perícias e reuniões em 7 dias</div></a>
      <a class="card-num ${prazos.length ? "aviso" : ""}" href="#agenda"><div class="n">${prazos.length}</div><div class="l">prazos nos próximos 7 dias</div></a>
      <a class="card-num ${vencidas.length ? "alerta" : ""}" href="#honorarios"><div class="n">${moeda(soma(vencidas))}</div><div class="l">honorários vencidos (${vencidas.length} parcela${vencidas.length === 1 ? "" : "s"})</div></a>
      <a class="card-num" href="#honorarios"><div class="n">${moeda(recebidoMes)}</div><div class="l">recebido neste mês</div></a>
      <a class="card-num ${incompletas.length ? "aviso" : ""}" href="#clientes" data-filtro="incompletas"><div class="n">${incompletas.length}</div><div class="l">fichas incompletas</div></a>
      <a class="card-num" href="#clientes" data-filtro="sem-email"><div class="n">${semEmail.length}</div><div class="l">clientes sem e-mail (não recebem avisos)</div></a>
      <a class="card-num" href="#clientes" data-filtro="docs"><div class="n">${Object.keys(docsPend).length}</div><div class="l">clientes com documentos pendentes</div></a>
      <a class="card-num" href="#clientes"><div class="n">${ativos.length}</div><div class="l">clientes ativos</div></a>
    </div>

async function marcarPago(id) {
  const r = await db.from("parcelas").update({ pago_em: HOJE() }).eq("id", id);

// ================= AGENDA =================
async function telaAgenda() {
  app.innerHTML = '<div class="carregando">Carregando agenda...</div>';
  const hoje = isoDeBrasilia(HOJE(), "00:00");
  const ate = new Date(Date.now() + 90 * 864e5).toISOString();
  const semanaPassada = new Date(Date.now() - 7 * 864e5).toISOString();
  const [fut, and] = await Promise.all([
    db.from("eventos").select("*").neq("tipo", "andamento").gte("data_hora", hoje).lte("data_hora", ate).order("data_hora", { ascending: true }),
    db.from("eventos").select("*").eq("tipo", "andamento").gte("criado_em", semanaPassada).order("criado_em", { ascending: false }),
  ]);
  if (fut.error || and.error) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc((fut.error || and.error).message)}</div></div>`);
  const grupos = {};
  for (const e of fut.data) (grupos[chaveDia(e.data_hora)] ||= []).push(e);
  const hojeK = HOJE(), amanhaK = somaDias(hojeK, 1);
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra"><div><h1>Agenda</h1><p class="mudo peq">Próximos 90 dias, de todos os clientes.</p></div>
      <button class="btn btn-primario" id="novo-ev">+ Lançar evento</button></div>
    ${Object.keys(grupos).length ? Object.entries(grupos).map(([k, evs]) => `
      <div class="grupo-data">${k === hojeK ? "Hoje · " : k === amanhaK ? "Amanhã · " : ""}${esc(dataLonga(evs[0].data_hora))}</div>
      <div class="lista">${evs.map((e) => itemEvento(e)).join("")}</div>`).join("") : `<div class="vazio">Nenhum compromisso nos próximos 90 dias.</div>`}
    <div class="grupo-data" style="margin-top:18px">Andamentos lançados nos últimos 7 dias</div>
    ${and.data.length ? `<div class="lista">${and.data.map((e) => itemEvento(e)).join("")}</div>` : `<div class="vazio">Nenhum andamento lançado nesta semana.</div>`}
  </div>`;
  app.querySelector("#novo-ev").onclick = () => dialogoEvento({ escolherProcesso: true, depois: telaAgenda });
  ligarEventos(app, [...fut.data, ...and.data], telaAgenda);
}

async function telaClientes() {
  const filtro = S.filtroClientes || ""; S.filtroClientes = "";
  let pend = {};
  if (filtro === "docs") {
    const r = await db.from("documentos").select("*").eq("entregue", false);
    (r.data || []).forEach((d) => (pend[d.cliente_id] = 1));
  }
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra">
      <div><h1>Clientes</h1><p class="mudo peq"><span id="total"></span></p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" id="importar">Importar planilha</button><button class="btn btn-primario" id="novo-cli">+ Novo cliente</button></div>
    </div>
    <div class="barra">
      <input type="search" id="busca" placeholder="Buscar por nome, CPF, e-mail, telefone ou nº do processo" aria-label="Buscar">
      <select id="filtro" style="max-width:260px" aria-label="Filtro">
        <option value="">Todos os clientes</option><option value="ativos">Somente ativos</option><option value="incompletas">Fichas incompletas</option>
        <option value="sem-email">Sem e-mail</option><option value="docs">Com documentos pendentes</option><option value="inativos">Inativos</option>
        <optgroup label="Por área do direito">${Object.entries(AREAS).map(([k, a]) => `<option value="area:${k}">${a[0]}</option>`).join("")}<option value="area:">Sem área</option></optgroup>
      </select>
    </div>
    <div class="lista" id="lista"></div>
  </div>`;
  const busca = app.querySelector("#busca"), lista = app.querySelector("#lista"), sel = app.querySelector("#filtro");
  sel.value = filtro;
  const nProc = {};
  for (const p of S.processos) if (!p.arquivado) nProc[p.cliente_id] = (nProc[p.cliente_id] || 0) + 1;
  const desenhar = async () => {
    if (sel.value === "docs" && !Object.keys(pend).length) {
      const r = await db.from("documentos").select("*").eq("entregue", false);
      (r.data || []).forEach((d) => (pend[d.cliente_id] = 1));
    }
    const q = norm(busca.value), qd = q.replace(/\D/g, "");
    const achados = S.clientes.filter((c) => {
      const f = sel.value;
      if (f === "ativos" && !c.ativo) return false;
      if (f === "inativos" && c.ativo) return false;
      if (f === "incompletas" && !(c.ativo && pendenciasFicha(c).length)) return false;
      if (f === "sem-email" && (c.email || !c.ativo)) return false;
      if (f === "docs" && !pend[c.id]) return false;
      if (f.startsWith("area:")) {
        const ps = S.processos.filter((p) => p.cliente_id === c.id && !p.arquivado);
        if (f === "area:" ? !ps.some((p) => !p.area) : !ps.some((p) => p.area === f.slice(5))) return false;
      }
      if (!q) return true;
      if (norm(c.nome).includes(q) || norm(c.email).includes(q)) return true;
      if (qd.length >= 4 && [c.whatsapp, c.cpf, c.cnpj].some((x) => String(x || "").replace(/\D/g, "").includes(qd))) return true;
      return S.processos.some((p) => p.cliente_id === c.id && (norm(p.titulo).includes(q) || (qd.length >= 4 && String(p.numero || "").replace(/\D/g, "").includes(qd))));
    });
    app.querySelector("#total").textContent = `${S.clientes.filter((c) => c.ativo).length} ativos · ${S.clientes.length} no total · ${achados.length} na lista`;
    lista.innerHTML = achados.length ? achados.slice(0, 400).map((c) => {
      const pf = pendenciasFicha(c);
      return `<div class="item clicavel ${c.ativo ? "" : "inativo"}" data-cli="${c.id}">
        <div class="principal"><b>${esc(c.nome)}</b>${c.ativo ? "" : ' <span class="tag tag-oculto">inativo</span>'}${pf.length && c.ativo ? ' <span class="tag tag-incompleta">ficha incompleta</span>' : ""}
          <div class="sec">${c.cpf ? "CPF " + esc(c.cpf) + " · " : c.cnpj ? "CNPJ " + esc(c.cnpj) + " · " : ""}${c.email ? esc(c.email) : '<span style="color:var(--warn)">sem e-mail</span>'}${c.whatsapp ? " · " + mostraWhats(c.whatsapp) : ""}${c.cidade ? " · " + esc(c.cidade) : ""}</div></div>
        <div class="dir" style="align-items:center">${c.drive_url ? `<a class="btn-drive" href="${esc(c.drive_url)}" target="_blank" rel="noopener" title="Abrir a pasta no Drive" aria-label="Abrir a pasta no Drive" data-parar>Drive</a>` : ""}${areasDoCliente(c.id).map(tagArea).join(" ")}<span class="contador">${nProc[c.id] || 0} processo${(nProc[c.id] || 0) === 1 ? "" : "s"}</span></div>
      </div>`;
    }).join("") : `<div class="vazio" style="border:0">Nenhum cliente encontrado.</div>`;
  };
  busca.addEventListener("input", desenhar);
  sel.addEventListener("change", desenhar);
  lista.addEventListener("click", (e) => { if (e.target.closest("[data-parar]")) return; const i = e.target.closest("[data-cli]"); if (i) location.hash = "cliente/" + i.dataset.cli; });
  app.querySelector("#novo-cli").onclick = () => dialogoFicha({});
  app.querySelector("#importar").onclick = dialogoImportar;
  desenhar();
  busca.focus();
}

                <div class="sec peq mudo">${MOD_HON[h.modalidade]}${h.valor_fixo ? " · " + moeda(h.valor_fixo) : ""}${h.percentual ? " · " + String(h.percentual).replace(".", ",") + "% do proveito" : ""}${h.processo_id && S.proc[h.processo_id] ? " · " + esc(S.proc[h.processo_id].titulo) : ""}</div>
                ${ps.length ? `<div class="peq" style="margin-top:4px">Pago ${moeda(pago)} de ${moeda(total)}</div>` : ""}</div>
                <div class="dir" style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start"><button class="btn btn-sec btn-peq" data-add-parc="${h.id}">+ Parcela</button><button class="btn btn-sec btn-peq" data-editar-hon="${h.id}">Editar</button></div></div>
              ${ps.map((p) => `<div class="parcela ${p.pago_em ? "paga" : p.vencimento < hoje ? "vencida" : ""}">
                <span>${dBR(p.vencimento)} · <b>${moeda(p.valor)}</b></span>
                <span class="v">${p.pago_em ? "pago em " + dBR(p.pago_em) : p.vencimento < hoje ? "vencida" : "em aberto"}</span>
                <span style="display:flex;gap:6px">${p.pago_em ? `<button class="btn btn-sec btn-peq" data-despagar="${p.id}">Desfazer</button>` : `${botaoWhats(c.whatsapp, msgCobranca(c, p), "Cobrar")}<button class="btn btn-sec btn-peq" data-pagar="${p.id}">Pago</button>`}<button class="x" data-del-parc="${p.id}" title="Excluir parcela" aria-label="Excluir parcela">×</button></span>
              </div>`).join("")}
              ${h.observacoes ? `<p class="peq mudo" style="padding:8px 16px;white-space:pre-line">${esc(h.observacoes)}</p>` : ""}
            </div>`;
          }).join("") : `<div class="vazio">Nenhum honorário registrado. Ao gerar um contrato, você pode registrar os honorários automaticamente.</div>`}
        </div>
      </div>
    </div>
  </div>`;

  const recarregar = () => telaCliente(id);
  app.querySelector("#voltar").onclick = () => (location.hash = "clientes");
  app.querySelector("#editar-cli").onclick = () => dialogoFicha(c);
  app.querySelector("#nova-fila-cli").onclick = () => dialogoFila({ cliente_id: id, etapa: pf.length ? "cadastro" : "documentos" }, recarregar);
  if (S.advogado?.cofre) blocoCofre(c, app);
  app.querySelector("#gerar-doc").onclick = () => dialogoDocumento(c, recarregar);
  app.querySelector("#novo-proc").onclick = () => dialogoProcesso({ cliente_id: id });
  app.querySelector("#novo-hon").onclick = () => dialogoHonorario({ cliente_id: id }, recarregar);
  app.querySelector("#aplicar-check").onclick = () => dialogoChecklist(c, docs, recarregar);
  app.querySelector("#novo-doc").onclick = async () => {
    const item = prompt("Documento a solicitar:");
    if (!item || !item.trim()) return;
    const r = await db.from("documentos").insert({ cliente_id: id, item: item.trim(), ordem: docs.length });
    if (r.error) return toast(r.error.message, true);
    recarregar();
  };
  app.querySelectorAll("[data-doc]").forEach((cb) => (cb.onchange = async () => {
    const r = await db.from("documentos").update({ entregue: cb.checked, entregue_em: cb.checked ? hoje : null }).eq("id", cb.dataset.doc);
    if (r.error) toast(r.error.message, true); recarregar();
  }));
  app.querySelectorAll("[data-del-doc]").forEach((b) => (b.onclick = async () => {
    const r = await db.from("documentos").delete().eq("id", b.dataset.delDoc); if (r.error) toast(r.error.message, true); recarregar();
  }));
  app.querySelectorAll("[data-editar-proc]").forEach((b) => (b.onclick = () => dialogoProcesso(S.proc[b.dataset.editarProc])));
  app.querySelectorAll("[data-novo-ev]").forEach((b) => (b.onclick = () => dialogoEvento({ processo_id: b.dataset.novoEv, depois: recarregar })));
  app.querySelectorAll("[data-juris-proc]").forEach((b) => (b.onclick = () => { S.jurisProc = b.dataset.jurisProc; location.hash = "jurisprudencia"; }));
  app.querySelectorAll("[data-calc-proc]").forEach((b) => (b.onclick = () => {
    const pr = S.proc[b.dataset.calcProc];
    const prev = pr.area ? pr.area === "previdenciario" : /previd|inss|aposent|benef|aux[ií]lio|pens[aã]o|bpc|loas|maternidade|incapacidade/i.test([pr.titulo, pr.parte_contraria, pr.juizo].join(" "));
    S.calcPreset = { aba: prev ? "causa" : "atualizacao", cliente_id: pr.cliente_id, processo_id: pr.id };
    location.hash = "calculos";
  }));
  app.querySelectorAll("[data-editar-hon]").forEach((b) => (b.onclick = () => dialogoHonorario(hons.find((h) => h.id === b.dataset.editarHon), recarregar)));
  app.querySelectorAll("[data-add-parc]").forEach((b) => (b.onclick = () => dialogoParcela(b.dataset.addParc, recarregar)));
  app.querySelectorAll("[data-pagar]").forEach((b) => (b.onclick = async () => { await marcarPago(b.dataset.pagar); recarregar(); }));
  app.querySelectorAll("[data-despagar]").forEach((b) => (b.onclick = async () => { await db.from("parcelas").update({ pago_em: null }).eq("id", b.dataset.despagar); recarregar(); }));
  app.querySelectorAll("[data-del-parc]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Excluir esta parcela?")) return;
    const r = await db.from("parcelas").delete().eq("id", b.dataset.delParc); if (r.error) toast(r.error.message, true); recarregar();
  }));
  ligarEventos(app, evs, recarregar);
}


// ================= FILA DE AJUIZAMENTO =================
const ETAPAS = {
  cadastro: ["Cadastro do cliente", "Ficha, procuração e contrato"],
  documentos: ["Documentação", "Digitalizar e subir no Drive"],
  redacao: ["Redação da inicial", "Petição em elaboração"],
  revisao: ["Revisão e assinatura", "Conferência final"],
  protocolo: ["Pronto para protocolar", "Só falta ajuizar"],
};
const ORDEM_ETAPAS = Object.keys(ETAPAS);
const PRIORIDADES = { urgente: ["Urgente", "#F8E6E3", "#8A2E22"], alta: ["Alta", "#FBF1DC", "#7A5200"], normal: ["Normal", "#EEEEF0", "#4A4F58"] };
const linkDrive = (url, rotulo = "Pasta no Drive", cls = "btn btn-sec btn-peq") =>
  url ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7.7 3h8.6l6.1 10.6-4.3 7.4H5.9L1.6 13.6 7.7 3Zm1.2 2L4 13.6 6.4 18h11.2l2.4-4.4L15.1 5H8.9Z"/></svg>${rotulo}</a>` : "";
const urlOk = (u) => !u || /^https:\/\/\S+$/i.test(u);

async function telaFila() {
  app.innerHTML = '<div class="carregando">Carregando fila...</div>';
  const hoje = HOJE();
  const [fq, dq] = await Promise.all([
    db.from("fila").select("*").order("criado_em", { ascending: true }),
    db.from("documentos").select("cliente_id,entregue"),
  ]);
  if (fq.error) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc(fq.error.message)}. Confira se o script 10 (fila e cofre) foi executado no Supabase.</div></div>`);
  const docs = {};
  (dq.data || []).forEach((d) => { docs[d.cliente_id] ||= { tot: 0, ok: 0 }; docs[d.cliente_id].tot++; if (d.entregue) docs[d.cliente_id].ok++; });
  const ativos = fq.data.filter((x) => x.etapa !== "ajuizado");
  const ajuizados = fq.data.filter((x) => x.etapa === "ajuizado").sort((a, b) => String(b.ajuizado_em).localeCompare(String(a.ajuizado_em))).slice(0, 20);
  const filtroResp = S.filaResp || "";
  const vis = ativos.filter((x) => !filtroResp || x.responsavel === filtroResp);
  const peso = { urgente: 0, alta: 1, normal: 2 };
  const lim = (x) => [x.prazo_ajuizar, x.prazo].filter(Boolean).sort()[0] || "9999";
  const ordenar = (a, b) => peso[a.prioridade] - peso[b.prioridade] || lim(a).localeCompare(lim(b)) || String(a.criado_em).localeCompare(String(b.criado_em));
  const vencendo = ativos.filter((x) => x.prazo && x.prazo <= somaDias(hoje, 15)).length;
  const atrasadas = ativos.filter((x) => x.prazo_ajuizar && x.prazo_ajuizar < hoje).length;
  const noLimite = ativos.filter((x) => x.prazo_ajuizar && x.prazo_ajuizar >= hoje && x.prazo_ajuizar <= somaDias(hoje, 2)).length;
  const resps = [...new Set(ativos.map((x) => x.responsavel).filter(Boolean))];

  const cartao = (x) => {
    const c = S.cli[x.cliente_id] || {};
    const pf = pendenciasFicha(c);
    const d = docs[x.cliente_id];
    const dias = x.prazo ? Math.round((new Date(x.prazo + "T12:00:00Z") - new Date(hoje + "T12:00:00Z")) / 864e5) : null;
    const dAj = x.prazo_ajuizar ? Math.round((new Date(x.prazo_ajuizar + "T12:00:00Z") - new Date(hoje + "T12:00:00Z")) / 864e5) : null;
    const i = ORDEM_ETAPAS.indexOf(x.etapa);
    const drive = x.drive_url || c.drive_url;
    return `<div class="fila-card" data-fila="${x.id}">
      <div class="fila-topo">${tagArea(x.area)}${x.prioridade !== "normal" ? ` <span class="tag" style="background:${PRIORIDADES[x.prioridade][1]};color:${PRIORIDADES[x.prioridade][2]}">${PRIORIDADES[x.prioridade][0]}</span>` : ""}</div>
      <a class="fila-nome" href="#cliente/${x.cliente_id}">${esc(c.nome || "Cliente")}</a>
      <div class="fila-tit">${esc(x.titulo)}</div>
      <div class="fila-info">
        ${x.prazo_ajuizar ? `<span style="${dAj < 0 ? "color:var(--err);font-weight:700" : dAj <= 2 ? "color:var(--warn);font-weight:700" : ""}">Ajuizar até ${dBR(x.prazo_ajuizar)}${dAj < 0 ? ` (atrasada ${-dAj} dia${dAj === -1 ? "" : "s"})` : dAj === 0 ? " (hoje)" : ` (${dAj} dia${dAj === 1 ? "" : "s"})`}</span>` : ""}
        ${x.prazo ? `<span style="${dias <= 7 ? "color:var(--err);font-weight:700" : dias <= 15 ? "color:var(--warn);font-weight:600" : ""}">Prescrição/prazo ${dBR(x.prazo)}${dias < 0 ? " (vencido)" : dias === 0 ? " (hoje)" : ` (${dias} dia${dias === 1 ? "" : "s"})`}</span>` : ""}
        <span class="${pf.length ? "falta" : "ok"}">${pf.length ? "Ficha: falta " + esc(pf.join(", ")) : "Ficha completa"}</span>
        <span class="${d && d.ok < d.tot ? "falta" : d ? "ok" : "mudo"}">${d ? `Documentos: ${d.ok} de ${d.tot} entregues` : "Sem lista de documentos"}</span>
        <span class="${drive ? "ok" : "falta"}">${drive ? "Pasta no Drive vinculada" : "Sem pasta no Drive"}</span>
        ${x.responsavel ? `<span class="mudo">Responsável: ${esc(x.responsavel)}</span>` : ""}
      </div>
      ${x.observacoes ? `<div class="fila-obs">${esc(x.observacoes)}</div>` : ""}
      <div class="fila-botoes">
        ${i > 0 ? `<button class="btn btn-sec btn-peq" data-voltar="${x.id}" title="Voltar etapa" aria-label="Voltar etapa">◀</button>` : ""}
        ${x.etapa === "protocolo" ? `<button class="btn btn-primario btn-peq" data-ajuizar="${x.id}">Ajuizado</button>` : `<button class="btn btn-primario btn-peq" data-avancar="${x.id}">Avançar ▶</button>`}
        ${linkDrive(drive, "Drive")}
        <button class="btn btn-sec btn-peq" data-editar-fila="${x.id}">Editar</button>
      </div>
    </div>`;
  };

  app.innerHTML = `
  <div class="wrap-largo painel-corpo">
    <div class="barra"><div><h1>Fila de ajuizamento</h1><p class="mudo peq">${ativos.length} ${ativos.length === 1 ? "ação" : "ações"} na fila · compromisso de ajuizar em até 10 dias${atrasadas ? ` · <b style="color:var(--err)">${atrasadas} atrasada${atrasadas === 1 ? "" : "s"}</b>` : ""}${noLimite ? ` · <b style="color:var(--warn)">${noLimite} no limite</b>` : ""}${vencendo ? ` · <b style="color:var(--err)">${vencendo} com prescrição/prazo em até 15 dias</b>` : ""}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${resps.length > 1 || filtroResp ? `<select id="f-resp" aria-label="Responsável" style="width:auto"><option value="">Todos</option>${resps.map((r) => `<option ${r === filtroResp ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>` : ""}
        <button class="btn btn-primario" id="nova-fila">+ Nova ação na fila</button></div></div>
    <div class="quadro">${ORDEM_ETAPAS.map((k) => {
      const lst = vis.filter((x) => x.etapa === k).sort(ordenar);
      return `<section class="coluna"><header><b>${ETAPAS[k][0]}</b><span class="contador">${lst.length}</span><div class="peq mudo">${ETAPAS[k][1]}</div></header>
        ${lst.length ? lst.map(cartao).join("") : '<div class="coluna-vazia">Nada nesta etapa.</div>'}</section>`;
    }).join("")}</div>
    <div class="bloco" style="margin-top:26px"><h2 style="margin-bottom:10px">Ajuizadas recentemente</h2>
      ${ajuizados.length ? `<div class="lista">${ajuizados.map((x) => {
        const p = x.processo_id && S.proc[x.processo_id];
        return `<div class="item"><div class="principal"><b>${esc(S.cli[x.cliente_id]?.nome || "")}</b> ${tagArea(x.area)}
          <div class="sec">${esc(x.titulo)} · ajuizada em ${dBR(x.ajuizado_em)}${p?.numero ? " · nº " + esc(p.numero) : ""}</div></div>
          <div class="dir"><a class="btn btn-sec btn-peq" href="#cliente/${x.cliente_id}">Abrir ficha</a><button class="btn btn-sec btn-peq" data-reabrir="${x.id}">Voltar à fila</button></div></div>`;
      }).join("")}</div>` : '<div class="vazio">Nenhuma ação ajuizada pela fila ainda.</div>'}</div>
  </div>`;

  const mover = async (id, delta) => {
    const x = fq.data.find((y) => y.id === id);
    const nova = ORDEM_ETAPAS[Math.min(ORDEM_ETAPAS.length - 1, Math.max(0, ORDEM_ETAPAS.indexOf(x.etapa) + delta))];
    const r = await db.from("fila").update({ etapa: nova }).eq("id", id);
    if (r.error) return toast(r.error.message, true);
    toast(`${S.cli[x.cliente_id]?.nome || "Ação"}: ${ETAPAS[nova][0]}.`);
    telaFila();
  };
  app.querySelector("#nova-fila").onclick = () => dialogoFila({}, telaFila);
  app.querySelector("#f-resp")?.addEventListener("change", (e) => { S.filaResp = e.target.value; telaFila(); });
  app.querySelectorAll("[data-avancar]").forEach((b) => (b.onclick = () => mover(b.dataset.avancar, 1)));
  app.querySelectorAll("[data-voltar]").forEach((b) => (b.onclick = () => mover(b.dataset.voltar, -1)));
  app.querySelectorAll("[data-editar-fila]").forEach((b) => (b.onclick = () => dialogoFila(fq.data.find((y) => y.id === b.dataset.editarFila), telaFila)));
  app.querySelectorAll("[data-ajuizar]").forEach((b) => (b.onclick = () => dialogoAjuizar(fq.data.find((y) => y.id === b.dataset.ajuizar), telaFila)));
  app.querySelectorAll("[data-reabrir]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Voltar esta ação para a etapa \"Pronto para protocolar\"? O processo já cadastrado continua na ficha do cliente.")) return;
    const r = await db.from("fila").update({ etapa: "protocolo", ajuizado_em: null }).eq("id", b.dataset.reabrir);
    if (r.error) return toast(r.error.message, true); telaFila();
  }));
}

function dialogoFila(x, depois) {
  const novo = !x.id;
  const c0 = x.cliente_id ? S.cli[x.cliente_id] : null;
  const nomes = S.clientes.map((c) => c.nome).sort((a, b) => a.localeCompare(b, "pt-BR"));
  const eu = primeiroNome(S.advogado?.nome || "");
  abrir(`
  <form novalidate><h2>${novo ? "Nova ação na fila" : "Editar ação da fila"}</h2>
    <div class="campo"><label for="fl-cli">Cliente</label><input id="fl-cli" name="cliente" type="search" list="fl-lista" autocomplete="off" required value="${esc(c0?.nome || "")}" placeholder="Digite o nome; se não existir, será criado" ${novo ? "" : "readonly"}>
      <datalist id="fl-lista">${nomes.map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist></div>
    <div class="campo"><label for="fl-tit">Ação a ajuizar</label><input id="fl-tit" name="titulo" type="text" required value="${esc(x.titulo || "")}" placeholder="Ex.: Aposentadoria por idade rural"></div>
    <div class="linha2">
      <div class="campo"><label for="fl-area">Área</label><select id="fl-area" name="area"><option value="">Identificar pelo título</option>${Object.entries(AREAS).map(([k, a]) => `<option value="${k}" ${x.area === k ? "selected" : ""}>${a[0]}</option>`).join("")}</select></div>
      <div class="campo"><label for="fl-etapa">Etapa</label><select id="fl-etapa" name="etapa">${ORDEM_ETAPAS.map((k) => `<option value="${k}" ${(x.etapa || "cadastro") === k ? "selected" : ""}>${ETAPAS[k][0]}</option>`).join("")}</select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label for="fl-pri">Prioridade</label><select id="fl-pri" name="prioridade">${Object.entries(PRIORIDADES).map(([k, p]) => `<option value="${k}" ${(x.prioridade || "normal") === k ? "selected" : ""}>${p[0]}</option>`).join("")}</select></div>
      <div class="campo"><label for="fl-prazo">Prescrição ou prazo externo</label><input id="fl-prazo" name="prazo" type="date" value="${esc(x.prazo || "")}"><span class="dica">Prescrição, decadência ou data combinada.</span></div>
    </div>
    <div class="campo"><label for="fl-aj">Ajuizar até</label><input id="fl-aj" name="prazo_ajuizar" type="date" value="${esc(x.prazo_ajuizar || "")}"><span class="dica">${novo ? "Vazio: 10 dias a partir de hoje." : "Compromisso interno de 10 dias."}</span></div>
    <div class="campo"><label for="fl-resp">Responsável</label><input id="fl-resp" name="responsavel" type="text" list="fl-resps" value="${esc(x.responsavel ?? (novo ? eu : ""))}">
      <datalist id="fl-resps"><option value="Charles"></option><option value="Elmo"></option></datalist></div>
    <div class="campo"><label for="fl-drive">Pasta no Google Drive (link)</label><input id="fl-drive" name="drive_url" type="url" data-mask="drive" value="${esc(x.drive_url || c0?.drive_url || "")}" placeholder="https://drive.google.com/drive/folders/..."><span class="dica" id="fl-drive-dica">${c0?.drive_url ? "Veio da ficha do cliente." : "Se a ficha do cliente estiver sem pasta, este link também é gravado nela."}</span></div>
    <div class="campo"><label for="fl-obs">Observações</label><textarea id="fl-obs" name="observacoes" style="min-height:70px" placeholder="O que falta, tese, documentos pedidos...">${esc(x.observacoes || "")}</textarea></div>
    <div class="dlg-botoes">
      ${novo ? "" : '<button type="button" class="btn btn-perigo btn-peq" id="fl-excluir">Tirar da fila</button>'}
      <div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
    </div>
  </form>`, async (f) => {
    const nome = val(f, "cliente"), titulo = val(f, "titulo"), drive = val(f, "drive_url");
    if (!nome || !titulo) return toast("Informe o cliente e a ação.", true);
    if (!urlOk(drive)) return toast("O link do Drive deve começar com https://", true);
    let c = c0 || S.clientes.find((y) => norm(y.nome) === norm(nome));
    if (!c) {
      const rc = await db.from("clientes").insert({ nome, origem: "fila" }).select().single();
      if (rc.error) return toast(rc.error.message, true);
      c = rc.data;
    }
    // a pasta da ficha do cliente vale para a fila; só guarda link próprio se for diferente
    if (drive && !c.drive_url) {
      const u = await db.from("clientes").update({ drive_url: drive }).eq("id", c.id);
      if (!u.error) c.drive_url = drive;
    }
    const dados = { cliente_id: c.id, titulo, area: val(f, "area") || null, etapa: val(f, "etapa"), prioridade: val(f, "prioridade"),
      prazo: val(f, "prazo") || null, ...(val(f, "prazo_ajuizar") || !novo ? { prazo_ajuizar: val(f, "prazo_ajuizar") || null } : {}), responsavel: val(f, "responsavel") || null,
      drive_url: drive && drive !== c.drive_url ? drive : null, observacoes: val(f, "observacoes") || null };
    const r = novo ? await db.from("fila").insert(dados).select().single() : await db.from("fila").update(dados).eq("id", x.id).select().single();
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast(novo ? "Ação incluída na fila." : "Fila atualizada.");
    await recarregarBase(); depois && depois();
  });
  const flCli = dlg.querySelector("#fl-cli"), flDrive = dlg.querySelector("#fl-drive");
  flCli.addEventListener("change", () => {
    const c = S.clientes.find((y) => norm(y.nome) === norm(flCli.value));
    if (c?.drive_url && !flDrive.value) { flDrive.value = c.drive_url; validarCampo(flDrive); dlg.querySelector("#fl-drive-dica").textContent = "Veio da ficha do cliente."; }
  });
  dlg.querySelector("#fl-excluir")?.addEventListener("click", async () => {
    if (!confirm("Tirar esta ação da fila? O cliente continua cadastrado.")) return;
    const r = await db.from("fila").delete().eq("id", x.id);
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast("Retirada da fila."); depois && depois();
  });
}

function dialogoAjuizar(x, depois) {
  const c = S.cli[x.cliente_id] || {};
  abrir(`
  <form novalidate><h2>Registrar ajuizamento</h2>
    <p class="peq mudo" style="margin:-8px 0 14px">${esc(c.nome || "")} · ${esc(x.titulo)}</p>

const SERVICOS_COFRE = ["gov.br", "Meu INSS", "E-mail", "CNIS", "Receita Federal", "Banco", "eproc", "Certificado digital", "Prefeitura", "Detran"];
async function blocoCofre(c, raiz) {
  const box = raiz.querySelector("#cofre");
  if (!box) return;
  const r = await db.rpc("cofre_listar", { p_cliente: c.id });
  if (r.error) { box.innerHTML = `<div class="aviso aviso-erro peq">${esc(r.error.message)}</div>`; return; }
  const itens = r.data || [];
  box.innerHTML = itens.length ? `<div class="lista">${itens.map((s) => `
    <div class="cofre-item">
      <div class="cofre-serv"><b>${esc(s.servico)}</b>${s.usuario ? `<span class="peq">Usuário: <span class="sel">${esc(s.usuario)}</span></span>` : ""}
        ${s.tem_senha ? `<span class="peq">Senha: <span class="sel cofre-senha" data-senha="${s.id}">••••••••</span></span>` : '<span class="peq mudo">sem senha</span>'}
        ${s.observacao ? `<span class="peq mudo" style="white-space:pre-line">${esc(s.observacao)}</span>` : ""}</div>
      <div class="cofre-bot">
        ${s.tem_senha ? `<button class="btn btn-sec btn-peq" data-revelar="${s.id}">Mostrar</button><button class="btn btn-sec btn-peq" data-copiar="${s.id}">Copiar</button>` : ""}
        <button class="btn btn-sec btn-peq" data-editar-cofre="${s.id}">Editar</button></div>
    </div>`).join("")}</div>` : '<div class="vazio peq">Nenhuma senha guardada para este cliente.</div>';
  const revelar = async (id) => {
    const q = await db.rpc("cofre_revelar", { p_id: id });
    if (q.error) { toast(q.error.message, true); return null; }
    return q.data || "";
  };
  box.querySelectorAll("[data-revelar]").forEach((b) => (b.onclick = async () => {
    const alvo = box.querySelector(`[data-senha="${b.dataset.revelar}"]`);
    if (b.textContent === "Ocultar") { alvo.textContent = "••••••••"; b.textContent = "Mostrar"; return; }
    const s = await revelar(b.dataset.revelar); if (s == null) return;
    alvo.textContent = s; b.textContent = "Ocultar";
    setTimeout(() => { if (alvo.isConnected) { alvo.textContent = "••••••••"; b.textContent = "Mostrar"; } }, 30000);
  }));
  box.querySelectorAll("[data-copiar]").forEach((b) => (b.onclick = async () => {
    const s = await revelar(b.dataset.copiar); if (s == null) return;
    try { await navigator.clipboard.writeText(s); toast("Senha copiada."); } catch { toast("Não consegui copiar. Use Mostrar.", true); }
  }));
  box.querySelectorAll("[data-editar-cofre]").forEach((b) => (b.onclick = () => dialogoCofre(c, itens.find((s) => s.id === b.dataset.editarCofre), () => blocoCofre(c, raiz))));
  raiz.querySelector("#cofre-novo").onclick = () => dialogoCofre(c, {}, () => blocoCofre(c, raiz));
  raiz.querySelector("#cofre-hist").onclick = async () => {
    const h = await db.rpc("cofre_historico", { p_cliente: c.id });
    if (h.error) return toast(h.error.message, true);
    const acoes = { revelou: "viu a senha de", criou: "cadastrou", alterou: "alterou", excluiu: "excluiu" };
    abrir(`<form><h2>Histórico do cofre</h2><p class="peq mudo" style="margin:-8px 0 12px">${esc(c.nome)} · últimos 50 registros</p>
      ${h.data.length ? `<div class="lista">${h.data.map((a) => `<div class="item"><div class="principal"><b>${esc(primeiroNome((S.advogadosLista || []).find((x) => x.email.toLowerCase() === a.email)?.nome || a.email))}</b> ${acoes[a.acao] || a.acao} <b>${esc(a.servico || "")}</b><div class="sec">${dataBR(a.em)} ${horaBR(a.em)}</div></div></div>`).join("")}</div>` : '<div class="vazio">Sem registros.</div>'}
      <div class="dlg-botoes"><div class="dir"><button type="button" class="btn btn-primario" data-fechar>Fechar</button></div></div></form>`, async () => dlg.close());
  };
}

function dialogoCofre(c, s, depois) {
  const novo = !s.id;
  abrir(`
  <form novalidate autocomplete="off"><h2>${novo ? "Guardar senha" : "Editar senha"}</h2>
    <p class="peq mudo" style="margin:-8px 0 14px">${esc(c.nome)} · visível apenas para Charles e Elmo</p>
    <div class="campo"><label for="cf-serv">Serviço</label><input id="cf-serv" name="servico" type="text" list="cf-servs" required value="${esc(s.servico || "")}" placeholder="Ex.: gov.br">
      <datalist id="cf-servs">${SERVICOS_COFRE.map((x) => `<option value="${x}"></option>`).join("")}</datalist></div>
    <div class="campo"><label for="cf-user">Usuário, login ou CPF</label><input id="cf-user" name="usuario" type="text" autocomplete="off" value="${esc(s.usuario || "")}"></div>
    <div class="campo"><label for="cf-senha">Senha ou chave</label>
      <div style="display:flex;gap:6px"><input id="cf-senha" name="senha" type="password" autocomplete="new-password" placeholder="${novo ? "" : s.tem_senha ? "Deixe em branco para manter a atual" : ""}" style="flex:1">
      <button type="button" class="btn btn-sec btn-peq" id="cf-ver">Ver</button></div>
      ${novo ? "" : s.tem_senha ? '<label class="check" style="margin-top:6px"><input type="checkbox" name="apagar"><span>Apagar a senha guardada</span></label>' : ""}</div>
    <div class="campo"><label for="cf-obs">Observação</label><textarea id="cf-obs" name="obs" style="min-height:60px" placeholder="Ex.: nível prata, e-mail de recuperação, validade do certificado">${esc(s.observacao || "")}</textarea></div>
    <div class="dlg-botoes">
      ${novo ? "" : '<button type="button" class="btn btn-perigo btn-peq" id="cf-excluir">Excluir</button>'}
      <div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
    </div>
  </form>`, async (f) => {
    const servico = val(f, "servico");
    if (!servico) return toast("Informe o serviço.", true);
    const senhaDig = f.elements.senha.value;
    const senha = f.elements.apagar?.checked ? "" : senhaDig ? senhaDig : novo ? "" : null;
    const r = await db.rpc("cofre_salvar", { p_id: s.id || null, p_cliente: c.id, p_servico: servico, p_usuario: val(f, "usuario"), p_senha: senha, p_obs: val(f, "obs") });
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast("Guardado no cofre."); depois && depois();
  });
  dlg.querySelector("#cf-ver").onclick = () => { const i = dlg.querySelector("#cf-senha"); i.type = i.type === "password" ? "text" : "password"; };
  dlg.querySelector("#cf-excluir")?.addEventListener("click", async () => {
    if (!confirm(`Excluir do cofre o registro "${s.servico}"?`)) return;
    const r = await db.rpc("cofre_excluir", { p_id: s.id });
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast("Excluído do cofre."); depois && depois();
  });
}

let INDICES = null;
async function carregarIndices(forcar = false) {
  if (INDICES && !forcar) return INDICES;
  const series = ["inpc", "ipca", "ipcae", "igpm", "selic", "fselic", "taxalegal", "sm"];
  const rs = await Promise.all(series.map((s) => db.from("indices").select("serie,competencia,valor").eq("serie", s).order("competencia", { ascending: true }).range(0, 999)));
  const e = rs.find((r) => r.error);
  if (e) throw e.error;
  INDICES = prepararIndices(rs.flatMap((r) => r.data));
  return INDICES;
}
