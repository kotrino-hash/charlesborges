<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Escritório | Charles Borges Advocacia</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#1F2F42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script src="pizzip.min.js"></script>
<script src="docxtemplater.min.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="marca" href="#resumo"><img src="emblema.png" alt=""><span><b>CHARLES BORGES</b><small>PAINEL DO ESCRITÓRIO</small></span></a>
    <div class="acoes"><span id="quem" class="peq" style="color:#C9CFD8"></span><button class="link-topo" id="sair" hidden>Sair</button></div>
  </div>
</header>
<nav class="abas" id="abas" hidden aria-label="Seções">
  <div class="wrap" role="tablist">
    <button class="aba" role="tab" data-rota="resumo">Resumo</button>
    <button class="aba" role="tab" data-rota="agenda">Agenda</button>
    <button class="aba" role="tab" data-rota="clientes">Clientes</button>
    <button class="aba" role="tab" data-rota="publicacoes">Publicações</button>
    <button class="aba" role="tab" data-rota="honorarios">Honorários</button>
    <button class="aba" role="tab" data-rota="envios">Avisos enviados</button>
  </div>
</nav>
<main id="app"><div class="carregando">Carregando...</div></main>
<dialog id="dlg"></dialog>

<script type="module">
import {
  db, configurado, esc, primeiroNome, NOME_TIPO, dataBR, horaBR, dataLonga, partesData, isoDeBrasilia, chaveDia,
  normalizaWhats, mostraWhats, linkWhats, PORTAL_URL, montarLogin, toast
} from "./portal-comum.js";
import { MODELOS, ESTADOS_CIVIS, montarDados, gerarDocx, moeda, dividirParcelas } from "./documentos.js";

const app = document.getElementById("app");
const dlg = document.getElementById("dlg");
const abas = document.getElementById("abas");
const PAINEL_URL = PORTAL_URL.replace("cliente.html", "painel.html");
const ICON_WHATS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
const HOJE = () => partesData(new Date().toISOString()).data;
const somaDias = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dBR = (d) => (d ? d.split("-").reverse().join("/") : "");
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

const CHECKLISTS = {
  "Previdenciário (incapacidade)": ["RG e CPF", "Comprovante de residência atualizado", "Carteira de trabalho (CTPS)", "Extrato CNIS", "Comunicado de indeferimento ou cessação do INSS", "Laudos, exames e atestados médicos", "Receitas de medicamentos"],
  "Previdenciário rural (segurado especial)": ["RG e CPF", "Comprovante de residência atualizado", "Notas fiscais de produtor rural", "Inscrição de produtor rural (bloco)", "Certidão de casamento ou de nascimento dos filhos", "Documentos do imóvel rural (matrícula, ITR ou CCIR)", "Autodeclaração do segurado especial", "Comunicado de indeferimento do INSS", "Extrato CNIS"],
  "Bancário / revisional": ["RG e CPF", "Comprovante de residência atualizado", "Contrato bancário", "Comprovantes de pagamento das parcelas", "Extratos bancários do período", "Comprovante de renda"],
  "Família": ["RG e CPF", "Comprovante de residência atualizado", "Certidão de casamento ou nascimento", "Certidões de nascimento dos filhos", "Comprovante de renda", "Relação e documentos dos bens"],
  "Consumidor": ["RG e CPF", "Comprovante de residência atualizado", "Nota fiscal ou contrato", "Comprovantes de pagamento", "Protocolos de atendimento", "Fotos, vídeos ou prints"],
  "Trabalhista": ["RG e CPF", "Comprovante de residência atualizado", "Carteira de trabalho (CTPS)", "Contracheques", "Termo de rescisão", "Extrato do FGTS", "Nomes e contatos de testemunhas"],
  "Criminal": ["RG e CPF", "Comprovante de residência atualizado", "Boletim de ocorrência", "Intimações e decisões recebidas", "Comprovante de trabalho"],
  "Inventário / arrolamento": ["Certidão de óbito", "RG, CPF e certidões dos herdeiros", "Certidão de casamento do falecido", "Matrículas e documentos dos bens", "Certidões negativas (municipal, estadual e federal)", "Extratos bancários do falecido"],
};

const S = { advogado: null, clientes: [], processos: [], cli: {}, proc: {}, iniciado: false };

// ================= início =================
async function iniciar() {
  if (!configurado) return montarLogin(app, { titulo: "Painel do Escritório", sub: "", destino: PAINEL_URL });
  const { data: { session } } = await db.auth.getSession();
  if (session) await entrar(session); else mostrarLogin();
  db.auth.onAuthStateChange((ev, s) => {
    if (ev === "SIGNED_IN" && s && !S.iniciado) entrar(s);
    if (ev === "SIGNED_OUT") location.reload();
  });
}
function mostrarLogin() { montarLogin(app, { titulo: "Painel do Escritório", sub: "Acesso restrito aos advogados do escritório.", destino: PAINEL_URL }); }
document.getElementById("sair").addEventListener("click", () => db.auth.signOut());

async function entrar(session) {
  S.iniciado = true;
  if (location.hash.includes("access_token")) history.replaceState(null, "", location.pathname + "#resumo");
  app.innerHTML = '<div class="carregando">Carregando...</div>';
  const { data: adv } = await db.from("advogados").select("*");
  const eu = (adv || []).find((a) => a.email.toLowerCase() === session.user.email.toLowerCase());
  if (!eu) {
    app.innerHTML = `<div class="login"><div class="cartao"><h1>Acesso restrito</h1><p class="sub" style="margin-top:10px">O e-mail <b>${esc(session.user.email)}</b> não está autorizado a usar o painel.</p><button class="btn btn-sec" id="x">Sair</button></div></div>`;
    app.querySelector("#x").onclick = () => db.auth.signOut();
    return;
  }
  S.advogado = eu;
  document.getElementById("quem").textContent = primeiroNome(eu.nome);
  document.getElementById("sair").hidden = false;
  abas.hidden = false;
  await recarregarBase();
  window.addEventListener("hashchange", rotear);
  rotear();
}

async function recarregarBase() {
  const [c, p] = await Promise.all([
    db.from("clientes").select("*").order("nome", { ascending: true }),
    db.from("processos").select("*").order("criado_em", { ascending: true }),
  ]);
  if (c.error || p.error) return toast("Erro ao carregar dados: " + (c.error || p.error).message, true);
  S.clientes = c.data; S.processos = p.data;
  S.cli = Object.fromEntries(S.clientes.map((x) => [x.id, x]));
  S.proc = Object.fromEntries(S.processos.map((x) => [x.id, x]));
}

abas.addEventListener("click", (e) => { const r = e.target.closest("[data-rota]"); if (r) location.hash = r.dataset.rota; });

function rotear() {
  const [rota, id] = (location.hash.replace("#", "") || "resumo").split("/");
  const aba = rota === "cliente" ? "clientes" : rota;
  abas.querySelectorAll(".aba").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.rota === aba)));
  window.scrollTo(0, 0);
  if (rota === "agenda") return telaAgenda();
  if (rota === "clientes") return telaClientes();
  if (rota === "cliente" && id) return telaCliente(id);
  if (rota === "honorarios") return telaHonorarios();
  if (rota === "publicacoes") return telaPublicacoes();
  if (rota === "envios") return telaEnvios();
  return telaResumo();
}

// ================= auxiliares =================
function pendenciasFicha(c) {
  const f = [];
  if (!c.email) f.push("e-mail");
  if (c.tipo_pessoa === "pj") { if (!c.cnpj) f.push("CNPJ"); }
  else { if (!c.cpf) f.push("CPF"); if (!c.estado_civil && !c.rep_nome) f.push("estado civil"); }
  if (!c.logradouro || !c.cidade || !c.uf) f.push("endereço");
  return f;
}
function msgEvento(ev) {
  const p = S.proc[ev.processo_id], c = p && S.cli[p.cliente_id];
  const partes = [`Olá, ${primeiroNome(c?.nome)}! Aqui é do escritório Charles Borges Advocacia.`];
  if (ev.tipo === "andamento") partes.push(`Há uma atualização no seu processo ${p.titulo}: ${ev.titulo}.`);
  else {
    const verbo = ev.tipo === "reuniao" ? "agendada" : ev.tipo === "prazo" ? "registrado" : "marcada";
    partes.push(`Foi ${verbo} ${ev.tipo === "prazo" ? "um" : "uma"} ${NOME_TIPO[ev.tipo].toLowerCase()} no seu processo ${p.titulo}: ${ev.titulo}.`);
    partes.push(`Data: ${dataLonga(ev.data_hora)}, às ${horaBR(ev.data_hora)}.`);
    if (ev.local) partes.push(`Local: ${ev.local}.`);
    if (ev.link) partes.push(`Acesso: ${ev.link}`);
  }
  if (ev.descricao) partes.push(ev.descricao);
  partes.push(`Você também pode acompanhar pela área do cliente: ${PORTAL_URL}`);
  return partes.join("\n\n");
}
function msgAcesso(c) {
  return `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia.\n\nAgora você pode acompanhar seus processos, audiências e perícias pela área do cliente:\n${PORTAL_URL}\n\nPara entrar, use o e-mail ${c.email}. Você vai receber um e-mail com o botão de acesso e um código. Não precisa de senha.\n\nQualquer dúvida, estou à disposição.`;
}
function msgDocs(c, itens) {
  return `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia.\n\nPara darmos andamento ao seu caso, precisamos dos seguintes documentos:\n\n${itens.map((i) => "• " + i).join("\n")}\n\nPode mandar foto ou PDF aqui mesmo pelo WhatsApp. Obrigado!`;
}
function msgCobranca(c, parc) {
  return `Olá, ${primeiroNome(c.nome)}! Aqui é do escritório Charles Borges Advocacia.\n\nPassando para lembrar da parcela de honorários no valor de ${moeda(parc.valor)}, com vencimento em ${dBR(parc.vencimento)}.\n\nSe já pagou, por favor desconsidere e nos envie o comprovante. Obrigado!`;
}
function botaoWhats(numero, texto, rotulo = "WhatsApp") {
  if (!numero) return "";
  return `<a class="btn btn-whats btn-peq" target="_blank" rel="noopener" href="${linkWhats(numero, texto)}">${ICON_WHATS} ${rotulo}</a>`;
}
function statusAviso(ev) {
  if (!ev.visivel_cliente) return `<span class="tag tag-oculto">interno</span>`;
  if (!ev.notificar) return `<span class="peq mudo">sem aviso por e-mail</span>`;
  const env = [ev.aviso_enviado_em && "aviso", ev.lembrete_7d_enviado_em && "7 dias", ev.lembrete_1d_enviado_em && "véspera"].filter(Boolean);
  return env.length ? `<span class="peq mudo">e-mail enviado: ${env.join(", ")}</span>` : `<span class="peq mudo">e-mail programado</span>`;
}
function itemEvento(e, comCliente = true) {
  const p = S.proc[e.processo_id], c = p && S.cli[p.cliente_id];
  return `<div class="item">
    <div class="principal">
      <div>${e.tipo !== "andamento" ? `<span class="hora">${dataBR(e.data_hora).slice(0, 5)} ${horaBR(e.data_hora)}</span>` : `<span class="peq mudo">${dataBR(e.criado_em)}</span> `}
        <span class="tag tag-${e.tipo}">${NOME_TIPO[e.tipo]}</span></div>
      <div><b>${esc(e.titulo)}</b></div>
      ${comCliente ? `<div class="sec"><a href="#cliente/${c?.id}">${esc(c?.nome || "")}</a> · ${esc(p?.titulo || "")}${e.local ? " · " + esc(e.local) : ""}</div>` : ""}
      <div>${statusAviso(e)}</div>
    </div>
    <div class="dir">
      ${e.visivel_cliente ? botaoWhats(c?.whatsapp, msgEvento(e)) : ""}
      <button class="btn btn-sec btn-peq" data-editar-ev="${e.id}">Editar</button>
    </div>
  </div>`;
}
function ligarEventos(raiz, lista, depois) {
  raiz.querySelectorAll("[data-editar-ev]").forEach((b) => (b.onclick = () => dialogoEvento({ evento: lista.find((x) => x.id === b.dataset.editarEv), depois })));
}

// ================= RESUMO =================
function saudacao() { const h = Number(new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", hourCycle: "h23" }).format(new Date())); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
async function telaResumo() {
  app.innerHTML = '<div class="carregando">Carregando resumo...</div>';
  const hoje = HOJE();
  const iniHoje = isoDeBrasilia(hoje, "00:00");
  const fim7 = isoDeBrasilia(somaDias(hoje, 7), "23:59");
  const [ev, hon, par, docs, pubs] = await Promise.all([
    db.from("eventos").select("*").neq("tipo", "andamento").gte("data_hora", iniHoje).lte("data_hora", fim7).order("data_hora", { ascending: true }),
    db.from("honorarios").select("*"),
    db.from("parcelas").select("*").order("vencimento", { ascending: true }),
    db.from("documentos").select("*"),
    db.from("publicacoes").select("id").eq("lida", false),
  ]);
  const naoLidas = pubs.error ? 0 : pubs.data.length;
  const erro = ev.error || hon.error || par.error || docs.error;
  if (erro) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc(erro.message)}</div></div>`);
  const honPor = Object.fromEntries(hon.data.map((h) => [h.id, h]));
  const abertas = par.data.filter((p) => !p.pago_em);
  const vencidas = abertas.filter((p) => p.vencimento < hoje);
  const proximas = abertas.filter((p) => p.vencimento >= hoje && p.vencimento <= somaDias(hoje, 15));
  const soma = (l) => l.reduce((s, p) => s + Number(p.valor), 0);
  const ativos = S.clientes.filter((c) => c.ativo);
  const incompletas = ativos.filter((c) => pendenciasFicha(c).length);
  const semEmail = ativos.filter((c) => !c.email);
  const docsPend = {};
  docs.data.filter((d) => !d.entregue).forEach((d) => (docsPend[d.cliente_id] = (docsPend[d.cliente_id] || 0) + 1));
  const prazos = ev.data.filter((e) => e.tipo === "prazo");
  const compromissos = ev.data.filter((e) => e.tipo !== "prazo");
  const iniMes = hoje.slice(0, 8) + "01";
  const recebidoMes = soma(par.data.filter((p) => p.pago_em && p.pago_em >= iniMes && p.pago_em <= hoje));

  const linhaParcela = (p) => {
    const h = honPor[p.honorario_id], c = h && S.cli[h.cliente_id];
    return `<div class="item"><div class="principal"><div><b>${moeda(p.valor)}</b> <span class="peq ${p.vencimento < hoje ? "" : "mudo"}" style="${p.vencimento < hoje ? "color:var(--err)" : ""}">vence ${dBR(p.vencimento)}</span></div>
      <div class="sec"><a href="#cliente/${c?.id}">${esc(c?.nome || "")}</a> · ${esc(h?.descricao || "")}</div></div>
      <div class="dir">${botaoWhats(c?.whatsapp, msgCobranca(c || {}, p), "Cobrar")}<button class="btn btn-sec btn-peq" data-pagar="${p.id}">Marcar pago</button></div></div>`;
  };

  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra"><div><h1>${saudacao()}, ${esc(primeiroNome(S.advogado.nome))}.</h1><p class="mudo peq">${esc(dataLonga(new Date().toISOString()))}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" id="r-cli">+ Novo cliente</button><button class="btn btn-primario" id="r-ev">+ Lançar evento</button></div></div>
    <div class="cards">
      <a class="card-num ${naoLidas ? "aviso" : ""}" href="#publicacoes"><div class="n">${naoLidas}</div><div class="l">publicações novas do DJEN</div></a>
      <a class="card-num" href="#agenda"><div class="n">${compromissos.length}</div><div class="l">audiências, perícias e reuniões em 7 dias</div></a>
      <a class="card-num ${prazos.length ? "aviso" : ""}" href="#agenda"><div class="n">${prazos.length}</div><div class="l">prazos nos próximos 7 dias</div></a>
      <a class="card-num ${vencidas.length ? "alerta" : ""}" href="#honorarios"><div class="n">${moeda(soma(vencidas))}</div><div class="l">honorários vencidos (${vencidas.length} parcela${vencidas.length === 1 ? "" : "s"})</div></a>
      <a class="card-num" href="#honorarios"><div class="n">${moeda(recebidoMes)}</div><div class="l">recebido neste mês</div></a>
      <a class="card-num ${incompletas.length ? "aviso" : ""}" href="#clientes" data-filtro="incompletas"><div class="n">${incompletas.length}</div><div class="l">fichas incompletas</div></a>
      <a class="card-num" href="#clientes" data-filtro="sem-email"><div class="n">${semEmail.length}</div><div class="l">clientes sem e-mail (não recebem avisos)</div></a>
      <a class="card-num" href="#clientes" data-filtro="docs"><div class="n">${Object.keys(docsPend).length}</div><div class="l">clientes com documentos pendentes</div></a>
      <a class="card-num" href="#clientes"><div class="n">${ativos.length}</div><div class="l">clientes ativos</div></a>
    </div>
    <div class="colunas">
      <div>
        <div class="bloco"><h2 style="margin-bottom:10px">Próximos 7 dias</h2>
          ${ev.data.length ? `<div class="lista">${ev.data.map((e) => itemEvento(e)).join("")}</div>` : `<div class="vazio">Nada marcado para os próximos 7 dias.</div>`}</div>
      </div>
      <div>
        <div class="bloco"><h2 style="margin-bottom:10px">Honorários a receber</h2>
          ${vencidas.length || proximas.length ? `<div class="lista">${[...vencidas, ...proximas].slice(0, 15).map(linhaParcela).join("")}</div>` : `<div class="vazio">Nenhuma parcela vencida ou a vencer em 15 dias.</div>`}</div>
        ${incompletas.length ? `<div class="bloco"><h2 style="margin-bottom:10px">Fichas para completar</h2><div class="lista">${incompletas.slice(0, 8).map((c) => `
          <div class="item clicavel" data-cli="${c.id}"><div class="principal"><b>${esc(c.nome)}</b><div class="sec">falta: ${pendenciasFicha(c).join(", ")}</div></div></div>`).join("")}</div></div>` : ""}
      </div>
    </div>
  </div>`;
  app.querySelector("#r-ev").onclick = () => dialogoEvento({ escolherProcesso: true, depois: telaResumo });
  app.querySelector("#r-cli").onclick = () => dialogoFicha({});
  app.querySelectorAll("[data-filtro]").forEach((a) => a.addEventListener("click", () => (S.filtroClientes = a.dataset.filtro)));
  app.querySelectorAll("[data-cli]").forEach((i) => (i.onclick = () => (location.hash = "cliente/" + i.dataset.cli)));
  app.querySelectorAll("[data-pagar]").forEach((b) => (b.onclick = async () => { await marcarPago(b.dataset.pagar); telaResumo(); }));
  ligarEventos(app, ev.data, telaResumo);
}

async function marcarPago(id) {
  const r = await db.from("parcelas").update({ pago_em: HOJE() }).eq("id", id);
  if (r.error) toast(r.error.message, true); else toast("Parcela marcada como paga.");
}

// ================= AGENDA =================
async function telaAgenda() {
  app.innerHTML = '<div class="carregando">Carregando agenda...</div>';
  const hoje = isoDeBrasilia(HOJE(), "00:00");
  const ate = new Date(Date.now() + 90 * 864e5).toISOString();
  const semanaPassada = new Date(Date.now() - 7 * 864e5).toISOString();
  const [fut, and] = await Promise.all([
    db.from("eventos").select("*").neq("tipo", "andamento").gte("data_hora", hoje).lte("data_hora", ate).order("data_hora", { ascending: true }),
    db.from("eventos").select("*").eq("tipo", "andamento").gte("criado_em", semanaPassada).order("criado_em", { ascending: false }),
  ]);
  if (fut.error || and.error) return (app.innerHTML = `<div class="wrap painel-corpo"><div class="aviso aviso-erro">${esc((fut.error || and.error).message)}</div></div>`);
  const grupos = {};
  for (const e of fut.data) (grupos[chaveDia(e.data_hora)] ||= []).push(e);
  const hojeK = HOJE(), amanhaK = somaDias(hojeK, 1);
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra"><div><h1>Agenda</h1><p class="mudo peq">Próximos 90 dias, de todos os clientes.</p></div>
      <button class="btn btn-primario" id="novo-ev">+ Lançar evento</button></div>
    ${Object.keys(grupos).length ? Object.entries(grupos).map(([k, evs]) => `
      <div class="grupo-data">${k === hojeK ? "Hoje · " : k === amanhaK ? "Amanhã · " : ""}${esc(dataLonga(evs[0].data_hora))}</div>
      <div class="lista">${evs.map((e) => itemEvento(e)).join("")}</div>`).join("") : `<div class="vazio">Nenhum compromisso nos próximos 90 dias.</div>`}
    <div class="grupo-data" style="margin-top:18px">Andamentos lançados nos últimos 7 dias</div>

// ================= CLIENTES =================
async function telaClientes() {
  const filtro = S.filtroClientes || ""; S.filtroClientes = "";
  let pend = {};
  if (filtro === "docs") {
    const r = await db.from("documentos").select("*").eq("entregue", false);
    (r.data || []).forEach((d) => (pend[d.cliente_id] = 1));
  }
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <div class="barra">
      <div><h1>Clientes</h1><p class="mudo peq"><span id="total"></span></p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sec" id="importar">Importar planilha</button><button class="btn btn-primario" id="novo-cli">+ Novo cliente</button></div>
    </div>
    <div class="barra">
      <input type="search" id="busca" placeholder="Buscar por nome, CPF, e-mail, telefone ou nº do processo" aria-label="Buscar">
      <select id="filtro" style="max-width:260px" aria-label="Filtro">
        <option value="">Todos os clientes</option><option value="ativos">Somente ativos</option><option value="incompletas">Fichas incompletas</option>
        <option value="sem-email">Sem e-mail</option><option value="docs">Com documentos pendentes</option><option value="inativos">Inativos</option>
      </select>
    </div>
    <div class="lista" id="lista"></div>
  </div>`;
  const busca = app.querySelector("#busca"), lista = app.querySelector("#lista"), sel = app.querySelector("#filtro");
  sel.value = filtro;
  const nProc = {};
  for (const p of S.processos) if (!p.arquivado) nProc[p.cliente_id] = (nProc[p.cliente_id] || 0) + 1;
  const desenhar = async () => {
    if (sel.value === "docs" && !Object.keys(pend).length) {
      const r = await db.from("documentos").select("*").eq("entregue", false);
      (r.data || []).forEach((d) => (pend[d.cliente_id] = 1));
    }
    const q = norm(busca.value), qd = q.replace(/\D/g, "");
    const achados = S.clientes.filter((c) => {
      const f = sel.value;
      if (f === "ativos" && !c.ativo) return false;
      if (f === "inativos" && c.ativo) return false;
      if (f === "incompletas" && !(c.ativo && pendenciasFicha(c).length)) return false;
      if (f === "sem-email" && (c.email || !c.ativo)) return false;
      if (f === "docs" && !pend[c.id]) return false;
      if (!q) return true;
      if (norm(c.nome).includes(q) || norm(c.email).includes(q)) return true;
      if (qd.length >= 4 && [c.whatsapp, c.cpf, c.cnpj].some((x) => String(x || "").replace(/\D/g, "").includes(qd))) return true;
      return S.processos.some((p) => p.cliente_id === c.id && (norm(p.titulo).includes(q) || (qd.length >= 4 && String(p.numero || "").replace(/\D/g, "").includes(qd))));
    });
    app.querySelector("#total").textContent = `${S.clientes.filter((c) => c.ativo).length} ativos · ${S.clientes.length} no total · ${achados.length} na lista`;
    lista.innerHTML = achados.length ? achados.slice(0, 400).map((c) => {
      const pf = pendenciasFicha(c);
      return `<div class="item clicavel ${c.ativo ? "" : "inativo"}" data-cli="${c.id}">
        <div class="principal"><b>${esc(c.nome)}</b>${c.ativo ? "" : ' <span class="tag tag-oculto">inativo</span>'}${pf.length && c.ativo ? ' <span class="tag tag-incompleta">ficha incompleta</span>' : ""}
          <div class="sec">${c.cpf ? "CPF " + esc(c.cpf) + " · " : c.cnpj ? "CNPJ " + esc(c.cnpj) + " · " : ""}${c.email ? esc(c.email) : '<span style="color:var(--warn)">sem e-mail</span>'}${c.whatsapp ? " · " + mostraWhats(c.whatsapp) : ""}${c.cidade ? " · " + esc(c.cidade) : ""}</div></div>
        <div class="dir"><span class="contador">${nProc[c.id] || 0} processo${(nProc[c.id] || 0) === 1 ? "" : "s"}</span></div>
      </div>`;
    }).join("") : `<div class="vazio" style="border:0">Nenhum cliente encontrado.</div>`;
  };
  busca.addEventListener("input", desenhar);
  sel.addEventListener("change", desenhar);
  lista.addEventListener("click", (e) => { const i = e.target.closest("[data-cli]"); if (i) location.hash = "cliente/" + i.dataset.cli; });
  app.querySelector("#novo-cli").onclick = () => dialogoFicha({});
  app.querySelector("#importar").onclick = dialogoImportar;
  desenhar();
  busca.focus();
}

    const r1 = await db.rpc("djen_buscar_agora", { dias });

    toast("Consultando o DJEN... aguarde alguns segundos.");
    await new Promise((ok) => setTimeout(ok, 15000));
    const r2 = await db.rpc("djen_processar_agora");
    if (r2.error) return toast(r2.error.message, true);
    toast(r2.data ? `${r2.data} publicação(ões) nova(s).` : "Nenhuma publicação nova nesta consulta.");
    telaPublicacoes();
  };

  app.querySelector("#buscar30").onclick = (e) => { e.target.disabled = true; buscar(30); };
  app.querySelector("#ler-todas")?.addEventListener("click", async () => {
    const ids = lista.filter((p) => !p.lida).map((p) => p.id);
    const r3 = await db.from("publicacoes").update({ lida: true }).in("id", ids);
    if (r3.error) toast(r3.error.message, true); telaPublicacoes();
  });
  app.querySelectorAll("[data-vermais]").forEach((b) => (b.onclick = () => {

  }));
  app.querySelectorAll("[data-lida]").forEach((b) => (b.onclick = async () => {
    await db.from("publicacoes").update({ lida: true }).eq("id", Number(b.dataset.lida)); telaPublicacoes();
  }));
  app.querySelectorAll("[data-mostrar]").forEach((b) => (b.onclick = () => {
    const p = lista.find((x) => String(x.id) === b.dataset.mostrar);
    const procs = procPorNum[p.numero_processo] || [];
    dialogoEvento({ evento: { tipo: "andamento", titulo: p.tipo || "Publicação no processo", descricao: "", visivel_cliente: true, notificar: true, processo_id: procs[0].id },
      escolherProcesso: false, depois: async () => { await db.from("publicacoes").update({ lida: true }).eq("id", p.id); telaPublicacoes(); } });
    toast("Escreva ao cliente, em linguagem simples, o que a publicação significa.");
  }));
  app.querySelectorAll("[data-cadastrar]").forEach((b) => (b.onclick = () => dialogoCadastrarPub(lista.find((x) => String(x.id) === b.dataset.cadastrar))));

async function telaHonorarios() {
  app.innerHTML = '<div class="carregando">Carregando...</div>';
  const [hon, par] = await Promise.all([db.from("honorarios").select("*"), db.from("parcelas").select("*").order("vencimento", { ascending: true })]);
  if (hon.error || par.error) return toast((hon.error || par.error).message, true);
  const hoje = HOJE(), honPor = Object.fromEntries(hon.data.map((h) => [h.id, h]));
  const abertas = par.data.filter((p) => !p.pago_em);
  const vencidas = abertas.filter((p) => p.vencimento < hoje);
  const aVencer = abertas.filter((p) => p.vencimento >= hoje);
  const iniMes = hoje.slice(0, 8) + "01";
  const pagasMes = par.data.filter((p) => p.pago_em && p.pago_em >= iniMes).sort((a, b) => (a.pago_em < b.pago_em ? 1 : -1));
  const soma = (l) => l.reduce((s, p) => s + Number(p.valor), 0);
  const exito = hon.data.filter((h) => !h.encerrado && (h.modalidade === "previdenciario" || h.modalidade === "exito" || h.modalidade === "misto") && h.percentual);
  const linha = (p, acao = true) => {
    const h = honPor[p.honorario_id], c = h && S.cli[h.cliente_id];
    return `<div class="item"><div class="principal"><div><b>${moeda(p.valor)}</b> <span class="peq" style="${!p.pago_em && p.vencimento < hoje ? "color:var(--err)" : "color:var(--muted)"}">${p.pago_em ? "pago em " + dBR(p.pago_em) : "vence " + dBR(p.vencimento)}</span></div>
      <div class="sec"><a href="#cliente/${c?.id}">${esc(c?.nome || "")}</a> · ${esc(h?.descricao || "")}</div></div>
      ${acao ? `<div class="dir">${botaoWhats(c?.whatsapp, msgCobranca(c || {}, p), "Cobrar")}<button class="btn btn-sec btn-peq" data-pagar="${p.id}">Marcar pago</button></div>` : ""}</div>`;
  };
  app.innerHTML = `
  <div class="wrap painel-corpo">
    <h1 style="margin-bottom:14px">Honorários</h1>
    <div class="cards">
      <div class="card-num ${vencidas.length ? "alerta" : ""}"><div class="n">${moeda(soma(vencidas))}</div><div class="l">vencidos (${vencidas.length})</div></div>
      <div class="card-num"><div class="n">${moeda(soma(aVencer))}</div><div class="l">a vencer (${aVencer.length})</div></div>
      <div class="card-num"><div class="n">${moeda(soma(pagasMes))}</div><div class="l">recebido neste mês</div></div>
      <div class="card-num"><div class="n">${exito.length}</div><div class="l">contratos de êxito em andamento</div></div>
    </div>
    <div class="colunas">
      <div>
        <div class="bloco"><h2 style="margin-bottom:10px">Vencidos</h2>${vencidas.length ? `<div class="lista">${vencidas.map((p) => linha(p)).join("")}</div>` : `<div class="vazio">Nenhuma parcela vencida.</div>`}</div>
        <div class="bloco"><h2 style="margin-bottom:10px">A vencer</h2>${aVencer.length ? `<div class="lista">${aVencer.slice(0, 60).map((p) => linha(p)).join("")}</div>` : `<div class="vazio">Nenhuma parcela a vencer.</div>`}</div>
      </div>
      <div>
        <div class="bloco"><h2 style="margin-bottom:10px">Recebidos neste mês</h2>${pagasMes.length ? `<div class="lista">${pagasMes.map((p) => linha(p, false)).join("")}</div>` : `<div class="vazio">Nenhum recebimento registrado neste mês.</div>`}</div>
        <div class="bloco"><h2 style="margin-bottom:10px">Contratos de êxito em andamento</h2>${exito.length ? `<div class="lista">${exito.map((h) => {
          const c = S.cli[h.cliente_id];
          return `<div class="item clicavel" data-cli="${c?.id}"><div class="principal"><b>${esc(c?.nome || "")}</b><div class="sec">${esc(h.descricao)} · ${String(h.percentual).replace(".", ",")}%</div></div></div>`;
        }).join("")}</div>` : `<div class="vazio">Nenhum contrato de êxito registrado.</div>`}</div>
      </div>
    </div>
  </div>`;
  app.querySelectorAll("[data-pagar]").forEach((b) => (b.onclick = async () => { await marcarPago(b.dataset.pagar); telaHonorarios(); }));
  app.querySelectorAll("[data-cli]").forEach((i) => (i.onclick = () => (location.hash = "cliente/" + i.dataset.cli)));
}

function abrir(html, aoEnviar, grande = false) {
  dlg.className = grande ? "grande" : "";
  dlg.innerHTML = html;
  const f = dlg.querySelector("form");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = f.querySelector("[type=submit]"); b.disabled = true;
    try { await aoEnviar(f); } finally { b.disabled = false; }
  });
  dlg.querySelectorAll("[data-fechar]").forEach((b) => (b.onclick = () => dlg.close()));
  dlg.showModal();
  dlg.querySelector("input:not([type=hidden]),select,textarea")?.focus();
}
const val = (f, n) => (f.elements[n] ? String(f.elements[n].value || "").trim() : "");
const inp = (nome, rot, v, extra = "", cls = "c3") =>
  `<div class="campo ${cls}"><label for="f-${nome}">${rot}</label><input id="f-${nome}" name="${nome}" type="text" value="${esc(v)}" ${extra}></div>`;
const selEC = (nome, v) => `<select id="f-${nome}" name="${nome}"><option value="">Não informado</option>${Object.entries(ESTADOS_CIVIS).map(([k, t]) => `<option value="${k}" ${v === k ? "selected" : ""}>${t[0].replace(/o$/, "o(a)").replace("em união estável", "União estável")}</option>`).join("")}</select>`;
const SEXO = (nome, v) => `<select id="f-${nome}" name="${nome}"><option value="m" ${v !== "f" ? "selected" : ""}>Masculino</option><option value="f" ${v === "f" ? "selected" : ""}>Feminino</option></select>`;
const UFS = "AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");

function mascaraCPF(v) { const d = String(v || "").replace(/\D/g, ""); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : String(v || "").trim(); }
function mascaraCNPJ(v) { const d = String(v || "").replace(/\D/g, ""); return d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5") : String(v || "").trim(); }
function mascaraCEP(v) { const d = String(v || "").replace(/\D/g, ""); return d.length === 8 ? d.replace(/(\d{5})(\d{3})/, "$1-$2") : String(v || "").trim(); }
function cpfValido(v) {
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  const calc = (n) => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return calc(9) === +d[9] && calc(10) === +d[10];
}

    if (novo) location.hash = "cliente/" + r.data.id; else rotear();
  }, true);

  const f = dlg.querySelector("form");
  const alternar = () => {
    const pjSel = f.elements.tipo_pessoa.value === "pj";
    dlg.querySelectorAll(".so-pf").forEach((x) => (x.hidden = pjSel));
    dlg.querySelectorAll(".so-pj").forEach((x) => (x.hidden = !pjSel));
    dlg.querySelector("#rot-nome").textContent = pjSel ? "Razão social" : "Nome completo";
    dlg.querySelector("#leg-rep").textContent = pjSel ? "Sócio / representante legal" : "Representante legal (menor, incapaz)";
  };
  f.elements.tipo_pessoa.addEventListener("change", alternar); alternar();
  // Busca de endereço pelo CEP (ViaCEP)
  f.elements.cep.addEventListener("blur", async () => {
    const d = f.elements.cep.value.replace(/\D/g, "");
    if (d.length !== 8) return;
    try {
      const r = await fetch(`https://viacep.com.br/ws/${d}/json/`); const j = await r.json();
      if (j.erro) return;
      if (!f.elements.logradouro.value && j.logradouro) f.elements.logradouro.value = j.logradouro;
      if (!f.elements.bairro.value && j.bairro) f.elements.bairro.value = j.bairro;
      if (j.localidade) f.elements.cidade.value = j.localidade;
      if (j.uf) f.elements.uf.value = j.uf;
      f.elements.cep.value = mascaraCEP(d);
    } catch { /* sem internet ou CEP inexistente: segue manual */ }
  });
  dlg.querySelector("#excluir")?.addEventListener("click", async () => {
    const n = S.processos.filter((p) => p.cliente_id === c.id).length;
    if (!confirm(`Excluir ${c.nome}${n ? ` e ${n} processo(s) com todos os eventos, honorários e documentos` : ""}? Esta ação não pode ser desfeita.\n\nSe quiser apenas bloquear o acesso, desmarque "Cliente ativo".`)) return;

  });
}

        <datalist id="lista-proc">${opcoesProc.map((o) => `<option value="${esc(o.rot)}"></option>`).join("")}</datalist></div>`
      : `<p class="peq mudo" style="margin:-8px 0 14px">${esc(S.cli[pAtual?.cliente_id]?.nome || "")} · ${esc(pAtual?.titulo || "")}</p>`}
    <div class="linha2">
      <div class="campo"><label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">${Object.entries(NOME_TIPO).map(([k, v]) => `<option value="${k}" ${e.tipo === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="campo"><label for="titulo">Título</label><input id="titulo" name="titulo" type="text" required value="${esc(e.titulo)}" placeholder="Ex.: Audiência de instrução"></div>
    </div>
    <div class="linha2" id="bloco-data">
      <div class="campo"><label for="data">Data</label><input id="data" name="data" type="date" value="${pd.data}"></div>
      <div class="campo"><label for="hora">Horário</label><input id="hora" name="hora" type="time" value="${pd.hora}"></div>
    </div>
    <div id="bloco-local">
      <div class="campo"><label for="local">Local</label><input id="local" name="local" type="text" value="${esc(e.local)}" placeholder="Ex.: Fórum de Anchieta, sala de audiências"></div>
      <div class="campo"><label for="link">Link de videoconferência</label><input id="link" name="link" type="url" value="${esc(e.link)}" placeholder="https://..."></div>
    </div>
    <div class="campo"><label for="descricao">Explicação para o cliente</label>
      <textarea id="descricao" name="descricao" placeholder="Ex.: Leve documento com foto e a carteira de trabalho. Chegue 30 minutos antes.">${esc(e.descricao)}</textarea>
      <span class="dica">Escreva em linguagem simples. Aparece no portal${novo ? " e no e-mail de aviso" : ""}.</span></div>
    <label class="check"><input type="checkbox" name="visivel" ${e.visivel_cliente ? "checked" : ""}><span>Mostrar para o cliente no portal</span></label>
    <label class="check"><input type="checkbox" name="notificar" ${e.notificar ? "checked" : ""}><span>Avisar o cliente por e-mail <span class="mudo peq">(aviso ao lançar e lembretes 7 dias e 1 dia antes)</span></span></label>
    <div class="dlg-botoes">
      ${novo ? "" : '<button type="button" class="btn btn-perigo btn-peq" id="excluir">Excluir</button>'}
      <div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
    </div>
  </form>`, async (f) => {
    let pid = e.processo_id;
    if (escolherProcesso) {
      const o = opcoesProc.find((x) => x.rot === f.elements.proc.value);
      if (!o) return toast("Escolha o cliente e o processo na lista de sugestões.", true);
      pid = o.id;
    }
    const tipo = f.elements.tipo.value, data = f.elements.data.value, hora = f.elements.hora.value;
    if (tipo !== "andamento" && !data) return toast("Informe a data.", true);
    const link = val(f, "link");
    if (link && !/^https?:\/\//i.test(link)) return toast("O link precisa começar com https://", true);
    const dados = {
      processo_id: pid, tipo, titulo: val(f, "titulo"),
      data_hora: data ? isoDeBrasilia(data, hora || (tipo === "prazo" ? "18:00" : "09:00")) : null,
      local: tipo === "andamento" ? null : val(f, "local") || null, link: tipo === "andamento" ? null : link || null,
      descricao: val(f, "descricao") || null, visivel_cliente: f.elements.visivel.checked,
      notificar: f.elements.visivel.checked && f.elements.notificar.checked,
    };
    const r = novo ? await db.from("eventos").insert(dados).select().single() : await db.from("eventos").update(dados).eq("id", e.id).select().single();
    if (r.error) return toast(r.error.message, true);
    dlg.close();
    toast(dados.notificar && novo ? "Evento salvo. O e-mail ao cliente sai em alguns minutos (entre 7h e 20h)." : "Evento salvo.");
    (depois || rotear)();
  });
  const f = dlg.querySelector("form");
  const ajustar = (mudouTipo) => {
    const t = f.elements.tipo.value;
    dlg.querySelector("#bloco-local").hidden = t === "andamento" || t === "prazo";
    dlg.querySelector('label[for="data"]').textContent = t === "andamento" ? "Data (opcional)" : "Data";
    if (mudouTipo && novo && t === "prazo") { f.elements.visivel.checked = false; f.elements.notificar.checked = false; }
    if (mudouTipo && novo && t !== "prazo") { f.elements.visivel.checked = true; f.elements.notificar.checked = true; }
    f.elements.notificar.disabled = !f.elements.visivel.checked;
  };
  f.elements.tipo.addEventListener("change", () => ajustar(true));
  f.elements.visivel.addEventListener("change", () => ajustar(false));
  ajustar(false);
  dlg.querySelector("#excluir")?.addEventListener("click", async () => {
    if (!confirm(`Excluir "${e.titulo}"?`)) return;
    const r = await db.from("eventos").delete().eq("id", e.id);
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast("Evento excluído."); (depois || rotear)();
  });
}

// ================= IMPORTAR PLANILHA =================
const COLUNAS = {
  nome: ["nome", "cliente", "nome completo", "razao social"], email: ["email", "e-mail"], whatsapp: ["whatsapp", "celular", "telefone", "fone", "contato"],
  cpf: ["cpf", "cpf/cnpj", "documento"], rg: ["rg", "identidade"], rg_orgao: ["orgao", "orgao expedidor", "expedidor"],
  nascimento: ["nascimento", "data de nascimento", "data nascimento"], estado_civil: ["estado civil"], profissao: ["profissao"],
  cep: ["cep"], logradouro: ["endereco", "logradouro", "rua"], numero: ["numero", "n", "nº"], bairro: ["bairro", "localidade"],
  cidade: ["cidade", "municipio"], uf: ["uf", "estado"], mae: ["mae", "nome da mae"], nit: ["nit", "pis", "nit/pis"], nb: ["nb", "beneficio"],
  proc_numero: ["processo", "numero do processo", "n do processo", "autos"], proc_titulo: ["assunto", "acao", "tipo de acao", "objeto"],
  proc_juizo: ["vara", "juizo", "comarca"], proc_parte: ["parte contraria", "reu", "requerido"],
};
function mapearCabecalho(h) {
  const n = norm(h).replace(/[._:]/g, " ").replace(/\s+/g, " ").trim();
  for (const [k, lst] of Object.entries(COLUNAS)) if (lst.includes(n)) return k;
  return null;
}
function paraData(v) {
  if (!v) return null;
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) : null;
}
function paraEC(v) {
  const n = norm(v);
  if (!n) return null;
  if (n.startsWith("solteir")) return "solteiro"; if (n.startsWith("casad")) return "casado"; if (n.includes("uniao") || n.includes("convivente")) return "uniao_estavel";
  if (n.startsWith("divorc")) return "divorciado"; if (n.startsWith("separad")) return "separado"; if (n.startsWith("viuv")) return "viuvo";
  return null;
}
async function carregarXLSX() {
  if (window.XLSX) return;
  await new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "xlsx.mini.min.js"; s.onload = ok; s.onerror = erro; document.head.appendChild(s); });
}
function dialogoImportar() {
  let linhas = [];
  abrir(`
  <form novalidate><h2>Importar clientes de planilha</h2>
    <p class="peq mudo" style="margin-bottom:12px">Aceita Excel (.xlsx) ou CSV. A primeira linha deve ter os nomes das colunas, por exemplo: <b>Nome, CPF, E-mail, WhatsApp, Endereço, Cidade, UF, Processo, Assunto, Vara</b>. Clientes com CPF ou e-mail já cadastrados são ignorados.</p>
    <div class="campo"><label for="i-arq">Arquivo</label><input id="i-arq" name="arquivo" type="file" accept=".xlsx,.xls,.csv"></div>
    <div id="i-prev"></div>
    <div class="dlg-botoes"><div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario" id="i-ok" disabled>Importar</button></div></div>
  </form>`, async () => {
    const cpfs = new Set(S.clientes.map((c) => String(c.cpf || "").replace(/\D/g, "")).filter(Boolean));
    const emails = new Set(S.clientes.map((c) => norm(c.email)).filter(Boolean));
    let ok = 0, pulados = 0, procs = 0, erros = 0;
    for (const l of linhas) {
      const cpfD = String(l.cpf || "").replace(/\D/g, "");
      if ((cpfD && cpfs.has(cpfD)) || (l.email && emails.has(norm(l.email)))) { pulados++; continue; }
      const pj = cpfD.length === 14;
      const dados = {
        nome: l.nome, email: l.email ? norm(l.email) : null, whatsapp: normalizaWhats(l.whatsapp) || null,
        tipo_pessoa: pj ? "pj" : "pf", cpf: !pj && cpfD ? mascaraCPF(cpfD) : null, cnpj: pj ? mascaraCNPJ(cpfD) : null,
        rg: l.rg || null, rg_orgao: l.rg_orgao || null, nascimento: paraData(l.nascimento), estado_civil: paraEC(l.estado_civil),
        profissao: l.profissao || null, cep: l.cep ? mascaraCEP(l.cep) : null, logradouro: l.logradouro || null, numero: l.numero ? String(l.numero) : null,
        bairro: l.bairro || null, cidade: l.cidade || null, uf: l.uf ? String(l.uf).toUpperCase().slice(0, 2) : null, mae: l.mae || null,
        nit: l.nit ? String(l.nit) : null, nb: l.nb ? String(l.nb) : null,
      };
      const r = await db.from("clientes").insert(dados).select().single();
      if (r.error) { erros++; continue; }
      ok++; if (cpfD) cpfs.add(cpfD); if (dados.email) emails.add(dados.email);
      if (l.proc_numero || l.proc_titulo) {
        const p = await db.from("processos").insert({ cliente_id: r.data.id, titulo: l.proc_titulo || "Processo", numero: l.proc_numero ? String(l.proc_numero) : null,
          juizo: l.proc_juizo || null, parte_contraria: l.proc_parte || null });
        if (!p.error) procs++;
      }
    }
    dlg.close();
    toast(`${ok} cliente(s) importado(s), ${procs} processo(s)${pulados ? `, ${pulados} já existiam` : ""}${erros ? `, ${erros} com erro` : ""}.`, erros > 0);
    await recarregarBase(); telaClientes();
  });
  dlg.querySelector("#i-arq").addEventListener("change", async (ev) => {
    const arq = ev.target.files[0]; if (!arq) return;
    const prevEl = dlg.querySelector("#i-prev");
    try {
      await carregarXLSX();
      const wb = window.XLSX.read(await arq.arrayBuffer(), { type: "array", cellDates: false });
      const bruto = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true });
      if (!bruto.length) { prevEl.innerHTML = '<div class="faltando">A planilha está vazia.</div>'; return; }
      const mapa = {}; const ignoradas = [];
      Object.keys(bruto[0]).forEach((h) => { const k = mapearCabecalho(h); if (k && !mapa[k]) mapa[k] = h; else if (!k) ignoradas.push(h); });
      if (!mapa.nome) { prevEl.innerHTML = '<div class="faltando">Não encontrei a coluna <b>Nome</b>. Renomeie o cabeçalho e tente de novo.</div>'; return; }
      linhas = bruto.map((b) => Object.fromEntries(Object.entries(mapa).map(([k, h]) => [k, String(b[h] ?? "").trim() || (typeof b[h] === "number" ? b[h] : "")])))
        .filter((l) => l.nome);
      prevEl.innerHTML = `<p class="peq"><b>${linhas.length}</b> cliente(s) encontrados. Colunas reconhecidas: ${Object.keys(mapa).map((k) => `<span class="contador">${esc(mapa[k])} → ${k.replace("proc_", "processo: ")}</span>`).join(" ")}
        ${ignoradas.length ? `<br><span class="mudo">Ignoradas: ${ignoradas.map(esc).join(", ")}</span>` : ""}</p>
        <table class="tabela-prev"><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Cidade</th></tr>${linhas.slice(0, 5).map((l) => `<tr><td>${esc(l.nome)}</td><td>${esc(l.cpf)}</td><td>${esc(l.email)}</td><td>${esc(l.cidade)}</td></tr>`).join("")}</table>`;
      dlg.querySelector("#i-ok").disabled = !linhas.length;
    } catch (e) { prevEl.innerHTML = `<div class="faltando">Não consegui ler o arquivo: ${esc(e.message)}</div>`; }
  });
}
