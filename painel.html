    </div>
    <div class="campo"><label for="descricao">Explicação para o cliente</label>
      <textarea id="descricao" name="descricao" placeholder="Ex.: Leve documento com foto e a carteira de trabalho. Chegue 30 minutos antes.">${esc(e.descricao)}</textarea>
      <span class="dica">Escreva em linguagem simples. Aparece no portal${novo ? " e no e-mail de aviso" : ""}.</span></div>
    <label class="check"><input type="checkbox" name="visivel" ${e.visivel_cliente ? "checked" : ""}><span>Mostrar para o cliente no portal</span></label>
    <label class="check"><input type="checkbox" name="notificar" ${e.notificar ? "checked" : ""}><span>Avisar o cliente por e-mail <span class="mudo peq">(aviso ao lançar e lembretes 7 dias e 1 dia antes)</span></span></label>
    <div class="dlg-botoes">
      ${novo ? "" : '<button type="button" class="btn btn-perigo btn-peq" id="excluir">Excluir</button>'}
      <div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario">Salvar</button></div>
    </div>
  </form>`, async (f) => {
    let pid = e.processo_id;
    if (escolherProcesso) {
      const o = opcoesProc.find((x) => x.rot === f.elements.proc.value);
      if (!o) return toast("Escolha o cliente e o processo na lista de sugestões.", true);
      pid = o.id;
    }
    const tipo = f.elements.tipo.value, data = f.elements.data.value, hora = f.elements.hora.value;
    if (tipo !== "andamento" && !data) return toast("Informe a data.", true);
    const link = val(f, "link");
    if (link && !/^https?:\/\//i.test(link)) return toast("O link precisa começar com https://", true);
    const dados = {
      processo_id: pid, tipo, titulo: val(f, "titulo"),
      data_hora: data ? isoDeBrasilia(data, hora || (tipo === "prazo" ? "18:00" : "09:00")) : null,
      local: tipo === "andamento" ? null : val(f, "local") || null, link: tipo === "andamento" ? null : link || null,
      descricao: val(f, "descricao") || null, visivel_cliente: f.elements.visivel.checked,
      notificar: f.elements.visivel.checked && f.elements.notificar.checked,
    };
    const r = novo ? await db.from("eventos").insert(dados).select().single() : await db.from("eventos").update(dados).eq("id", e.id).select().single();
    if (r.error) return toast(r.error.message, true);
    dlg.close();
    toast(dados.notificar && novo ? "Evento salvo. O e-mail ao cliente sai em alguns minutos (entre 7h e 20h)." : "Evento salvo.");
    (depois || rotear)();
  });
  const f = dlg.querySelector("form");
  const ajustar = (mudouTipo) => {
    const t = f.elements.tipo.value;
    dlg.querySelector("#bloco-local").hidden = t === "andamento" || t === "prazo";
    dlg.querySelector('label[for="data"]').textContent = t === "andamento" ? "Data (opcional)" : "Data";
    if (mudouTipo && novo && t === "prazo") { f.elements.visivel.checked = false; f.elements.notificar.checked = false; }
    if (mudouTipo && novo && t !== "prazo") { f.elements.visivel.checked = true; f.elements.notificar.checked = true; }
    f.elements.notificar.disabled = !f.elements.visivel.checked;
  };
  f.elements.tipo.addEventListener("change", () => ajustar(true));
  f.elements.visivel.addEventListener("change", () => ajustar(false));
  ajustar(false);
  dlg.querySelector("#excluir")?.addEventListener("click", async () => {
    if (!confirm(`Excluir "${e.titulo}"?`)) return;
    const r = await db.from("eventos").delete().eq("id", e.id);
    if (r.error) return toast(r.error.message, true);
    dlg.close(); toast("Evento excluído."); (depois || rotear)();
  });
}

// ================= IMPORTAR PLANILHA =================
const COLUNAS = {
  nome: ["nome", "cliente", "nome completo", "razao social"], email: ["email", "e-mail"], whatsapp: ["whatsapp", "celular", "telefone", "fone", "contato"],
  cpf: ["cpf", "cpf/cnpj", "documento"], rg: ["rg", "identidade"], rg_orgao: ["orgao", "orgao expedidor", "expedidor"],
  nascimento: ["nascimento", "data de nascimento", "data nascimento"], estado_civil: ["estado civil"], profissao: ["profissao"],
  cep: ["cep"], logradouro: ["endereco", "logradouro", "rua"], numero: ["numero", "n", "nº"], bairro: ["bairro", "localidade"],
  cidade: ["cidade", "municipio"], uf: ["uf", "estado"], mae: ["mae", "nome da mae"], nit: ["nit", "pis", "nit/pis"], nb: ["nb", "beneficio"],
  proc_numero: ["processo", "numero do processo", "n do processo", "autos"], proc_titulo: ["assunto", "acao", "tipo de acao", "objeto"],
  proc_juizo: ["vara", "juizo", "comarca"], proc_parte: ["parte contraria", "reu", "requerido"],
};
function mapearCabecalho(h) {
  const n = norm(h).replace(/[._:]/g, " ").replace(/\s+/g, " ").trim();
  for (const [k, lst] of Object.entries(COLUNAS)) if (lst.includes(n)) return k;
  return null;
}
function paraData(v) {
  if (!v) return null;
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) : null;
}
function paraEC(v) {
  const n = norm(v);
  if (!n) return null;
  if (n.startsWith("solteir")) return "solteiro"; if (n.startsWith("casad")) return "casado"; if (n.includes("uniao") || n.includes("convivente")) return "uniao_estavel";
  if (n.startsWith("divorc")) return "divorciado"; if (n.startsWith("separad")) return "separado"; if (n.startsWith("viuv")) return "viuvo";
  return null;
}
async function carregarXLSX() {
  if (window.XLSX) return;
  await new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "xlsx.mini.min.js"; s.onload = ok; s.onerror = erro; document.head.appendChild(s); });
}
function dialogoImportar() {
  let linhas = [];
  abrir(`
  <form novalidate><h2>Importar clientes de planilha</h2>
    <p class="peq mudo" style="margin-bottom:12px">Aceita Excel (.xlsx) ou CSV. A primeira linha deve ter os nomes das colunas, por exemplo: <b>Nome, CPF, E-mail, WhatsApp, Endereço, Cidade, UF, Processo, Assunto, Vara</b>. Clientes com CPF ou e-mail já cadastrados são ignorados.</p>
    <div class="campo"><label for="i-arq">Arquivo</label><input id="i-arq" name="arquivo" type="file" accept=".xlsx,.xls,.csv"></div>
    <div id="i-prev"></div>
    <div class="dlg-botoes"><div class="dir"><button type="button" class="btn btn-sec" data-fechar>Cancelar</button><button type="submit" class="btn btn-primario" id="i-ok" disabled>Importar</button></div></div>
  </form>`, async () => {
    const cpfs = new Set(S.clientes.map((c) => String(c.cpf || "").replace(/\D/g, "")).filter(Boolean));
    const emails = new Set(S.clientes.map((c) => norm(c.email)).filter(Boolean));
    let ok = 0, pulados = 0, procs = 0, erros = 0;
    for (const l of linhas) {
      const cpfD = String(l.cpf || "").replace(/\D/g, "");
      if ((cpfD && cpfs.has(cpfD)) || (l.email && emails.has(norm(l.email)))) { pulados++; continue; }
      const pj = cpfD.length === 14;
      const dados = {
        nome: l.nome, email: l.email ? norm(l.email) : null, whatsapp: normalizaWhats(l.whatsapp) || null,
        tipo_pessoa: pj ? "pj" : "pf", cpf: !pj && cpfD ? mascaraCPF(cpfD) : null, cnpj: pj ? mascaraCNPJ(cpfD) : null,
        rg: l.rg || null, rg_orgao: l.rg_orgao || null, nascimento: paraData(l.nascimento), estado_civil: paraEC(l.estado_civil),
        profissao: l.profissao || null, cep: l.cep ? mascaraCEP(l.cep) : null, logradouro: l.logradouro || null, numero: l.numero ? String(l.numero) : null,
        bairro: l.bairro || null, cidade: l.cidade || null, uf: l.uf ? String(l.uf).toUpperCase().slice(0, 2) : null, mae: l.mae || null,
        nit: l.nit ? String(l.nit) : null, nb: l.nb ? String(l.nb) : null,
      };
      const r = await db.from("clientes").insert(dados).select().single();
      if (r.error) { erros++; continue; }
      ok++; if (cpfD) cpfs.add(cpfD); if (dados.email) emails.add(dados.email);
      if (l.proc_numero || l.proc_titulo) {
        const p = await db.from("processos").insert({ cliente_id: r.data.id, titulo: l.proc_titulo || "Processo", numero: l.proc_numero ? String(l.proc_numero) : null,
          juizo: l.proc_juizo || null, parte_contraria: l.proc_parte || null });
        if (!p.error) procs++;
      }
    }
    dlg.close();
    toast(`${ok} cliente(s) importado(s), ${procs} processo(s)${pulados ? `, ${pulados} já existiam` : ""}${erros ? `, ${erros} com erro` : ""}.`, erros > 0);
    await recarregarBase(); telaClientes();
  });
  dlg.querySelector("#i-arq").addEventListener("change", async (ev) => {
    const arq = ev.target.files[0]; if (!arq) return;
    const prevEl = dlg.querySelector("#i-prev");
    try {
      await carregarXLSX();
      const wb = window.XLSX.read(await arq.arrayBuffer(), { type: "array", cellDates: false });
      const bruto = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true });
      if (!bruto.length) { prevEl.innerHTML = '<div class="faltando">A planilha está vazia.</div>'; return; }
      const mapa = {}; const ignoradas = [];
      Object.keys(bruto[0]).forEach((h) => { const k = mapearCabecalho(h); if (k && !mapa[k]) mapa[k] = h; else if (!k) ignoradas.push(h); });
      if (!mapa.nome) { prevEl.innerHTML = '<div class="faltando">Não encontrei a coluna <b>Nome</b>. Renomeie o cabeçalho e tente de novo.</div>'; return; }
      linhas = bruto.map((b) => Object.fromEntries(Object.entries(mapa).map(([k, h]) => [k, String(b[h] ?? "").trim() || (typeof b[h] === "number" ? b[h] : "")])))
        .filter((l) => l.nome);
      prevEl.innerHTML = `<p class="peq"><b>${linhas.length}</b> cliente(s) encontrados. Colunas reconhecidas: ${Object.keys(mapa).map((k) => `<span class="contador">${esc(mapa[k])} → ${k.replace("proc_", "processo: ")}</span>`).join(" ")}
        ${ignoradas.length ? `<br><span class="mudo">Ignoradas: ${ignoradas.map(esc).join(", ")}</span>` : ""}</p>
        <table class="tabela-prev"><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Cidade</th></tr>${linhas.slice(0, 5).map((l) => `<tr><td>${esc(l.nome)}</td><td>${esc(l.cpf)}</td><td>${esc(l.email)}</td><td>${esc(l.cidade)}</td></tr>`).join("")}</table>`;
      dlg.querySelector("#i-ok").disabled = !linhas.length;
    } catch (e) { prevEl.innerHTML = `<div class="faltando">Não consegui ler o arquivo: ${esc(e.message)}</div>`; }
  });
}
